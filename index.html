    <style>
        :root {
            --primary: #1565EF; --primary-dark: #1254C4; --accent: #0D9488;
            --surface: #FFFFFF; --surface-glass: rgba(255,255,255,0.92);
            --bg-start: #0F1E3D; --bg-mid: #15305A; --bg-end: #0A1628;
            --text-primary: #131827; --text-secondary: #5E6778; --text-muted: #8C93A3;
            --border: #E4E7ED; --error: #DE345D;
            --radius-sm: 10px; --radius-md: 16px; --radius-lg: 20px;
            --shadow-card: 0 8px 40px rgba(15,20,55,0.12);
            --shadow-elevated: 0 16px 64px rgba(15,20,55,0.18);
            --font-heading: 'AlibabaPuHuiTi', -apple-system, PingFang SC, Microsoft YaHei, sans-serif;
            --font-body: 'AlibabaPuHuiTi', -apple-system, PingFang SC, Microsoft YaHei, sans-serif;
            --font-display: 'AlibabaPuHuiTi', -apple-system, PingFang SC, Microsoft YaHei, sans-serif;
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-body); font-size: 15px; font-weight: 400; line-height: 1.6; color: var(--text-primary); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; background: linear-gradient(160deg, #0F1E3D 0%, #15305A 50%, #0A1628 100%) fixed; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        input, button, select, textarea { font-family: var(--font-body); }
        .ant-input, .ant-input-affix-wrapper input, .ant-btn, .ant-btn span,
        .ant-select-selector, .ant-form-item-label > label, .ant-form-item-explain,
        .ant-message-notice-content, .ant-tag, .ant-progress-text,
        .ant-spin-text, .ant-tooltip-inner { font-family: var(--font-body) !important; }

        .auth-page { min-height: 100vh; min-height: 100dvh; display: flex; overflow: hidden; background: var(--surface); }
        .auth-brand { display: none; flex: 1 1 48%; background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%); position: relative; overflow: hidden; align-items: center; justify-content: center; padding: 64px; }
        .auth-brand::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 30% 70%, rgba(21,101,239,0.25) 0%, transparent 60%), radial-gradient(ellipse 50% 50% at 70% 30%, rgba(13,148,136,0.18) 0%, transparent 55%), radial-gradient(circle at 85% 15%, rgba(255,255,255,0.06) 0%, transparent 40%); }
        .auth-brand::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 0%, transparent 70%); }
        .brand-content { position: relative; z-index: 1; text-align: center; max-width: 420px; }
        .brand-logo { width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 24px; overflow: hidden; background: #fff; padding: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.15); transition: transform var(--transition-base); }
        .brand-logo:hover { transform: scale(1.05) rotate(-2deg); }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 14px; }
        .brand-name { font-family: var(--font-heading); font-size: 38px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; margin-bottom: 8px; }
        .brand-name span { background: linear-gradient(135deg, #6CB3FF 0%, #5EEADB 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-tagline { font-size: 16px; color: rgba(255,255,255,0.65); line-height: 1.5; margin-bottom: 36px; }
        .brand-features { display: flex; flex-direction: column; gap: 14px; text-align: left; }
        .brand-feature { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.78); font-size: 14px; font-weight: 500; }
        .feature-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, #6CB3FF, #5EEADB); box-shadow: 0 0 12px rgba(108,179,255,0.5); }

        .auth-form-area { flex: 1 1 52%; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--surface); }
        .auth-card-wrapper { width: 100%; max-width: 420px; }
        .auth-form-header { text-align: center; margin-bottom: 32px; }
        .auth-form-header h2 { font-family: var(--font-heading); font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
        .auth-form-header p { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
        .auth-tabs { display: flex; background: #F5F6FA; border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition-base); border: none; background: transparent; font-family: var(--font-body); }
        .auth-tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(15,20,55,0.08); }
        .auth-tab:hover:not(.active) { color: var(--text-primary); }
        .ant-form-item { margin-bottom: 20px; }
        .ant-input-affix-wrapper { border-radius: var(--radius-sm) !important; border: 1.5px solid var(--border) !important; padding: 10px 14px !important; font-size: 14px !important; transition: all var(--transition-base) !important; box-shadow: none !important; }
        .ant-input-affix-wrapper:hover { border-color: #C0C6D1 !important; }
        .ant-input-affix-wrapper:focus-within, .ant-input-affix-wrapper.ant-input-affix-wrapper-focused { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(21,101,239,0.1) !important; }
        .ant-btn-primary { height: 48px !important; border-radius: var(--radius-sm) !important; font-size: 15px !important; font-weight: 600 !important; font-family: var(--font-body) !important; background: linear-gradient(135deg, var(--primary) 0%, #3363E0 50%, #1D4ED3 100%) !important; border: none !important; box-shadow: 0 4px 16px rgba(21,101,239,0.3) !important; transition: all var(--transition-base) !important; letter-spacing: 0.01em !important; }
        .ant-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(21,101,239,0.4) !important; }
        .ant-btn-primary:active { transform: scale(0.98); }
        .ant-btn-primary.ant-btn-loading { opacity: 0.85; transform: none; }
        .g-recaptcha-container { display: flex; justify-content: center; min-height: 78px; }

        /* Arithmetic Captcha */
        .arithmetic-captcha { background: #f8f9fb; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; min-height: 78px; display: flex; align-items: center; justify-content: center; }
        .arithmetic-row { display: flex; align-items: center; gap: 10px; width: 100%; }
        .arithmetic-problem { font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: var(--text-primary); white-space: nowrap; min-width: 100px; text-align: center; background: linear-gradient(135deg, rgba(21,101,239,0.08), rgba(13,148,136,0.08)); padding: 8px 14px; border-radius: 8px; }
        .arithmetic-input { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 600; text-align: center; font-family: var(--font-body); color: var(--text-primary); background: #fff; outline: none; transition: border-color 150ms; }
        .arithmetic-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(21,101,239,0.1); }
        .arithmetic-btn { padding: 10px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all 150ms; white-space: nowrap; }
        .arithmetic-btn:hover { background: var(--primary-dark); }
        .arithmetic-btn:active { transform: scale(0.97); }
        .arithmetic-refresh { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 150ms; flex-shrink: 0; }
        .arithmetic-refresh:hover { border-color: var(--primary); color: var(--primary); background: rgba(21,101,239,0.04); }
        .arithmetic-refresh:active { transform: scale(0.95); }
        .arithmetic-verified { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #52c41a; }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

        /* ===== App Shell (logged in) ===== */
        .app-shell { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; background: #F0F4F8; }
        .app-header { background: #FFFFFF; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .app-header-brand { display: flex; align-items: center; gap: 9px; }
        .app-header-logo { width: 32px; height: 32px; border-radius: 9px; overflow: hidden; background: #F5F6FA; padding: 3px; }
        .app-header-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; display: block; }
        .app-header-title { font-family: var(--font-heading); font-weight: 800; font-size: 20px; color: var(--text-primary); letter-spacing: -0.04em; }
        .app-header-user { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 5px 10px; border-radius: 999px; transition: background var(--transition-base); }
        .app-header-user:hover { background: #F5F6FA; }
        .app-header-user:active { background: #ECEEF2; transform: scale(0.97); }
        .app-content { flex: 1; overflow-y: auto; padding-bottom: calc(64px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }

        /* Bottom Tab Bar — Enterprise SaaS Mobile */
        .bottom-tab-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(228,231,237,0.8); display: flex; height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -8px 32px rgba(15,20,55,0.06); }
        .bottom-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; border: none; background: transparent; font-family: var(--font-body); transition: all 180ms cubic-bezier(0.4,0,0.2,1); padding: 8px 0 6px; position: relative; -webkit-tap-highlight-color: transparent; }
        .bottom-tab .tab-icon { font-size: 21px; line-height: 1; transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1), color 180ms ease; color: #94A3B8; }
        .bottom-tab .tab-label { font-size: 10px; font-weight: 500; color: #94A3B8; transition: color 180ms ease; letter-spacing: 0.02em; }
        .bottom-tab.active .tab-icon { color: var(--primary); transform: translateY(-2px) scale(1.1); }
        .bottom-tab.active .tab-label { color: var(--primary); font-weight: 700; }
        .bottom-tab.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 36px; height: 3px; background: linear-gradient(90deg, var(--primary), #3B82F6); border-radius: 0 0 4px 4px; }
        .bottom-tab:active .tab-icon { transform: scale(0.9); }

        /* Home Tab */
        .home-content { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
        .home-hero { background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-mid) 55%, var(--bg-end) 100%); border-radius: 20px; padding: 28px 24px 24px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: 0 8px 32px rgba(15,20,55,0.18); }
        .home-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(13,148,136,0.25) 0%, transparent 70%); }
        .home-hero::after { content: ''; position: absolute; bottom: -20px; left: -20px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(21,101,239,0.2) 0%, transparent 70%); }
        .home-hero-content { position: relative; z-index: 1; }
        .home-hero-greeting { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 4px; letter-spacing: 0.02em; }
        .home-hero h2 { font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 8px; letter-spacing: -0.02em; line-height: 1.2; }
        .home-hero-username { font-family: var(--font-display); font-weight: 700; font-size: 1.05em; letter-spacing: -0.03em; font-variant-numeric: lining-nums; font-feature-settings: 'kern' 1, 'ss01' 1; }
        .home-hero p { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 20px; line-height: 1.5; }
        .home-hero-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 999px; cursor: pointer; transition: all var(--transition-base); font-family: var(--font-body); backdrop-filter: blur(8px); }
        .home-hero-btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .home-hero-btn:active { transform: scale(0.97); }
        .home-section-title { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; letter-spacing: -0.01em; }
        .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .home-card { background: var(--surface); border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 12px rgba(15,20,55,0.06); cursor: pointer; transition: all 180ms cubic-bezier(0.4,0,0.2,1); border: 1.5px solid transparent; -webkit-tap-highlight-color: transparent; }
        .home-card:hover { border-color: rgba(21,101,239,0.2); box-shadow: 0 6px 24px rgba(21,101,239,0.1); transform: translateY(-2px); }
        .home-card:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(15,20,55,0.08); }
        .home-card-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .home-card h4 { font-family: var(--font-heading); font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
        .home-card p { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

        /* Home Map Layout */
        .home-map-page { position: relative; height: calc(100dvh - 116px - env(safe-area-inset-bottom)); overflow: hidden; }
        .home-map-container { position: absolute; top: 0; left: 0; right: 0; height: 280px; background: #E8EDF2; }
        .home-map { width: 100%; height: 100%; }
        .home-map-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to bottom, transparent 0%, #F0F4F8 100%); pointer-events: none; z-index: 5; }
        .home-map-logo-cover { position: absolute; bottom: 0; left: 0; width: 180px; height: 44px; background: linear-gradient(to right, #F0F4F8 55%, transparent 100%); pointer-events: none; z-index: 6; }
        .home-map .amap-logo { display: none !important; }
        .home-map .amap-copyright { display: none !important; }
        .home-map-status { position: absolute; top: 12px; left: 12px; z-index: 10; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
        .home-map-status.gps { color: #059669; }
        .home-map-status.ip { color: #D97706; }
        .home-map-status.loading { color: var(--primary); }
        .home-map-status.failed { color: #DC2626; }
        .home-map-refresh { position: absolute; bottom: 80px; right: 14px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.15); color: var(--primary); font-size: 18px; -webkit-tap-highlight-color: transparent; transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
        .home-map-refresh:hover { background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .home-map-refresh:active { transform: scale(0.93); }
        @keyframes map-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .home-map-refresh.spinning .anticon { animation: map-spin 0.7s linear infinite; }
        .home-sheet { position: absolute; left: 0; right: 0; top: 232px; bottom: -200px; border-radius: 28px 28px 0 0; background: #F0F4F8; box-shadow: 0 -20px 60px rgba(15,20,55,0.22), 0 -2px 0 rgba(255,255,255,0.9); will-change: transform; display: flex; flex-direction: column; z-index: 10; }
        .home-sheet-handle { padding: 14px 16px 0; flex-shrink: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .home-sheet-handle:active { cursor: grabbing; }
        .home-sheet-handle::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 2px; background: rgba(15,20,55,0.12); margin: 0 auto 14px; }
        .home-sheet-content { flex: 1; overflow-y: auto; padding: 0 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

        /* Home Footprint Overview */
        .home-footprint { background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(15,20,55,0.06); cursor: pointer; transition: all 180ms cubic-bezier(0.4,0,0.2,1); border: 1.5px solid transparent; }
        .home-footprint:hover { border-color: rgba(21,101,239,0.2); box-shadow: 0 6px 24px rgba(21,101,239,0.1); transform: translateY(-2px); }
        .home-footprint:active { transform: scale(0.98); }
        .home-footprint-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .home-footprint-title { display: flex; align-items: center; gap: 8px; }
        .home-footprint-title-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #EEF4FF 0%, #E0ECFF 100%); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 18px; }
        .home-footprint-title h4 { font-family: var(--font-heading); font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 0; }
        .home-footprint-title p { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }
        .home-footprint-link { font-size: 12px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 2px; }
        .home-footprint-stats { display: flex; gap: 0; margin-bottom: 16px; background: #F7F9FC; border-radius: 14px; padding: 14px 0; }
        .home-footprint-stat { flex: 1; text-align: center; position: relative; }
        .home-footprint-stat + .home-footprint-stat::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: rgba(15,20,55,0.08); }
        .home-footprint-stat-num { font-family: var(--font-heading); font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1; }
        .home-footprint-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .home-footprint-recent { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .home-footprint-recent::-webkit-scrollbar { display: none; }

        /* AI Chat */

        .ai-header-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #f5f7fa; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 150ms; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
        .ai-header-btn:hover { background: #EEF4FF; color: var(--primary); }

        .ai-history-info { flex: 1; min-width: 0; }

        .ai-history-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .ai-history-del { width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 150ms; }
        .ai-history-del:hover { background: #FFF1F0; color: #DE345D; }
        .ai-messages { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-behavior: smooth; }
        .ai-welcome { text-align: center; padding: 30px 20px 16px; }
        .ai-welcome-icon { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, rgba(21,101,239,0.12), rgba(13,148,136,0.12)); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .ai-welcome h3 { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .ai-welcome p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .ai-msg { display: flex; margin-bottom: 12px; }
        .ai-msg-user { justify-content: flex-end; }
        .ai-msg-ai { justify-content: flex-start; }
        .ai-msg-bubble { max-width: 92%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word; }
        .ai-msg-user .ai-msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
        .ai-msg-ai .ai-msg-bubble { background: var(--surface); color: var(--text-primary); border-bottom-left-radius: 6px; box-shadow: 0 2px 8px rgba(15,20,55,0.06); }
        .ai-msg-tool .ai-msg-bubble { background: #f8fafc; border: 1px solid #e8ecf1; border-radius: 14px; max-width: 95%; padding: 6px 10px; }
        .ai-msg-content h1, .ai-msg-content h2, .ai-msg-content h3 { font-family: var(--font-heading); margin: 12px 0 6px; font-weight: 700; }
        .ai-msg-content h1 { font-size: 17px; } .ai-msg-content h2 { font-size: 15px; } .ai-msg-content h3 { font-size: 14px; }
        .ai-msg-content p { margin: 6px 0; }
        .ai-msg-content ul, .ai-msg-content ol { padding-left: 20px; margin: 6px 0; }
        .ai-msg-content li { margin: 3px 0; }
        .ai-msg-content code { background: rgba(21,101,239,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .ai-msg-content pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
        .ai-msg-content pre code { background: none; color: inherit; padding: 0; }
        .ai-msg-content blockquote { border-left: 3px solid var(--primary); padding-left: 12px; margin: 8px 0; color: var(--text-secondary); }
        .ai-msg-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
        .ai-msg-content th, .ai-msg-content td { border: 1px solid #e5e7eb; padding: 6px 10px; text-align: left; }
        .ai-msg-content th { background: #f9fafb; font-weight: 600; }
        .ai-msg-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .ai-msg-content a { color: var(--primary); text-decoration: underline; }
        .ai-msg-content strong { font-weight: 700; }
        .ai-msg-attach { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        .ai-msg-attach-item { font-size: 11px; background: rgba(21,101,239,0.1); color: var(--primary); padding: 3px 8px; border-radius: 8px; }
        .ai-msg-fav { font-size: 11px; background: rgba(13,148,136,0.1); color: var(--accent); padding: 3px 8px; border-radius: 8px; margin-bottom: 6px; display: inline-block; }
        .ai-typing { display: inline-flex; gap: 4px; padding: 4px 0; }
        .ai-typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: ai-blink 1.4s infinite; }
        .ai-typing-dot:nth-child(2) { animation-delay: 0.2s; }

        .ai-typing-inline { display: inline-flex; gap: 3px; padding: 0 0 0 4px; vertical-align: middle; align-items: center; }
        .ai-typing-inline .ai-typing-dot { width: 5px; height: 5px; background: var(--primary); }
        .ai-think { margin-bottom: 8px; border-radius: 10px; background: rgba(21,101,239,0.05); border: 1px solid rgba(21,101,239,0.1); overflow: hidden; }

        .ai-think-arrow { font-size: 10px; color: var(--primary); opacity: 0.5; }

        .ai-search-results { margin-top: 8px; border-radius: 10px; background: rgba(21,101,239,0.04); border: 1px solid rgba(21,101,239,0.1); overflow: hidden; }
        .ai-search-toggle { display: flex; align-items: center; gap: 6px; padding: 8px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; font-size: 12px; color: var(--primary); font-weight: 600; }
        .ai-search-arrow { font-size: 10px; margin-left: auto; opacity: 0.5; }
        .ai-search-list { padding: 0 12px 10px; }
        .ai-search-item { padding: 8px 0; border-bottom: 1px solid rgba(228,231,237,0.5); }
        .ai-search-item:last-child { border-bottom: none; }
        .ai-search-title { font-size: 13px; font-weight: 600; color: var(--primary); text-decoration: none; display: block; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ai-search-snippet { font-size: 12px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ai-search-url { font-size: 11px; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ai-location-card { border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid #e8ecf1; margin: 8px 0; }
        .ai-loc-map { width: 100%; height: 150px; background: #f0f4f8; }
        .ai-loc-map-placeholder { width: 100%; height: 120px; background: linear-gradient(135deg, #e8ecf1 0%, #d5dbe3 100%); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; }

        .ai-loc-addr { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
        .ai-loc-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
        .ai-loc-actions { display: flex; gap: 8px; padding: 0 12px 10px; }
        .ai-loc-btn { flex: 1; height: 36px; border-radius: 18px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 150ms; -webkit-tap-highlight-color: transparent; }
        .ai-loc-btn-nav { background: var(--primary); color: #fff; }
        .ai-loc-btn-nav:active { opacity: 0.85; }
        .ai-loc-btn-fav { background: #f0f4f8; color: var(--text-primary); }
        .ai-loc-btn-fav.saved { background: rgba(13,148,136,0.1); color: var(--accent); }
        /* Tool Call Banner */
        .ai-toolcall-banner { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; margin: 6px 0; font-size: 13px; font-weight: 600; animation: ai-toolcall-pulse 1.2s ease-in-out infinite; }
        .ai-toolcall-banner.loading { background: linear-gradient(135deg, #EEF4FF 0%, #E0EBFF 100%); color: var(--primary); border: 1px solid rgba(21,101,239,0.15); }
        .ai-toolcall-banner.done { background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); color: #059669; border: 1px solid rgba(5,150,105,0.15); animation: none; }
        .ai-toolcall-spinner { width: 16px; height: 16px; border: 2.5px solid rgba(21,101,239,0.2); border-top-color: var(--primary); border-radius: 50%; animation: ai-spin 0.7s linear infinite; }
        @keyframes ai-toolcall-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes ai-spin { to { transform: rotate(360deg); } }
        @keyframes ai-blink { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }

        /* Tool Result Card */
        .ai-tool-result { border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid #e8ecf1; margin: 8px 0; }
        .ai-tool-result-header { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e8ecf1; font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* Itinerary Card */

        /* Comparison Card */

        .ai-status { text-align: center; font-size: 12px; color: var(--text-muted); padding: 8px 0; }

        .ai-fav-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: flex-end; justify-content: center; }

        .ai-fav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; transition: background 150ms; -webkit-tap-highlight-color: transparent; }

                fetch('/api/geo_log.php', { method: 'POST', body: blob }).catch(() => {});
            }
        } catch (e) {}
    }

    // Browser native geolocation permission check
    function checkBrowserGeoPermission() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve('unavailable'); return; }
            if (navigator.permissions) {
                navigator.permissions.query({ name: 'geolocation' }).then((result) => {
                    resolve(result.state); // 'granted', 'denied', 'prompt'
                }).catch(() => resolve('query_failed'));
            } else {
                resolve('no_permissions_api');
            }
        });
    }

    // ==================== Arithmetic Captcha ====================
    function ArithmeticCaptcha({ onVerify, resetKey }) {
        const [problem, setProblem] = useState('');
        const [answer, setAnswer] = useState('');
        const [correctAnswer, setCorrectAnswer] = useState(0);
        const [verified, setVerified] = useState(false);

        const generateProblem = useCallback(() => {
            const ops = ['+', '-', '×'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let a, b, result;
            switch (op) {
                case '+': a = Math.floor(Math.random() * 50) + 1; b = Math.floor(Math.random() * 50) + 1; result = a + b; break;
                case '-': a = Math.floor(Math.random() * 50) + 20; b = Math.floor(Math.random() * a) + 1; result = a - b; break;
                case '×': a = Math.floor(Math.random() * 10) + 1; b = Math.floor(Math.random() * 10) + 1; result = a * b; break;
            }
            setProblem(`${a} ${op} ${b} = ?`);
            setCorrectAnswer(result);
            setAnswer('');
            setVerified(false);
        }, []);

        useEffect(() => { generateProblem(); }, [generateProblem]);
        useEffect(() => { if (resetKey > 0) generateProblem(); }, [resetKey, generateProblem]);

        const handleVerify = () => {
            if (parseInt(answer) === correctAnswer) {
                setVerified(true);
                onVerify('arithmetic_verified_' + correctAnswer);
                message.success('验证成功');
            } else {
                message.error('计算错误，请重试');
                generateProblem();
            }
        };

        return (
            <div className="arithmetic-captcha">
                {verified ? (
                    <div className="arithmetic-verified"><CheckCircleFilled style={{ color: '#52c41a', fontSize: 18 }} /> 验证成功</div>
                ) : (
                    <div className="arithmetic-row">
                        <span className="arithmetic-problem">{problem}</span>
                        <input className="arithmetic-input" value={answer} onChange={e => setAnswer(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleVerify()} placeholder="输入答案" maxLength={4} />
                        <button className="arithmetic-btn" onClick={handleVerify}>确认</button>
                        <button className="arithmetic-refresh" onClick={generateProblem} title="换一题"><ReloadOutlined /></button>
                    </div>
                )}
            </div>
        );
    }

    // ==================== Recaptcha Widget ====================
    function RecaptchaWidget({ onVerify, resetKey }) {
        const containerRef = useRef(null);
        const widgetIdRef = useRef(null);
        const [useArithmetic, setUseArithmetic] = useState(false);

        useEffect(() => {
            let timeoutId;
            let intervalId;
            let rendered = false;

            const tryRender = () => {
                if (!window.grecaptcha?.render || !containerRef.current) return false;
                try {
                    widgetIdRef.current = window.grecaptcha.render(containerRef.current, {
                        sitekey: RECAPTCHA_SITE_KEY,
                        callback: (token) => { clearTimeout(timeoutId); onVerify(token); },
                        theme: 'light'
                    });
                    rendered = true;
                    return true;
                } catch(e) { return false; }
            };

            // Try to render immediately
            if (!tryRender()) {
                // Keep trying every 200ms
                intervalId = setInterval(() => {
                    if (tryRender()) clearInterval(intervalId);
                }, 200);
            }

            // 2 second timeout - switch to arithmetic quickly
            timeoutId = setTimeout(() => {
                if (!rendered) {
                    clearInterval(intervalId);
                    setUseArithmetic(true);
                }
            }, 2000);

            return () => {
                clearTimeout(timeoutId);
                clearInterval(intervalId);
            };
        }, []);

        useEffect(() => {
            if (resetKey > 0) {
                if (useArithmetic) {
                    setUseArithmetic(false);
                    setTimeout(() => setUseArithmetic(true), 50);
                } else if (widgetIdRef.current !== null && window.grecaptcha) {
                    try { window.grecaptcha.reset(widgetIdRef.current); } catch(e) {}
                }
            }
        }, [resetKey, useArithmetic]);

        if (useArithmetic) {
            return <ArithmeticCaptcha onVerify={onVerify} resetKey={resetKey} />;
        }

        return <div ref={containerRef} className="g-recaptcha-container"></div>;
    }

    function PreferencePage({ user, onBack }) {
        const [tier, setTier] = useState('quick');
        const [categories, setCategories] = useState({});
        const [customTags, setCustomTags] = useState([]);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [customInput, setCustomInput] = useState('');
        const [conflict, setConflict] = useState(null);
        const tagMapRef = useRef({}); // id => tag object

        const config = TIER_CONFIG[tier];

        // Fetch tags for current tier
        const fetchTags = useCallback(async (t) => {
            setLoading(true); setConflict(null);
            try {
                const res = await fetch(`/api/preferences/tags.php?tier=${t}`);
                const data = await res.json();
                if (data.success) {
                    setCategories(data.categories || {});
                    setSelectedIds(new Set(data.selected_ids || []));
                    setCustomTags(data.custom_tags || []);
                    // Build tag map for quick lookup
                    const map = {};
                    Object.values(data.categories || {}).forEach(tags => {
                        tags.forEach(tag => { map[tag.id] = tag; });
                    });
                    tagMapRef.current = map;
                }
            } catch(e) { message.error('加载标签失败'); }
            finally { setLoading(false); }
        }, []);

        useEffect(() => { fetchTags(tier); }, [tier]);

        // Toggle tag selection with conflict detection
        function toggleTag(tag) {
            const tagId = tag.id;
            const oppositeId = tag.opposite_id;

            setConflict(null);

            if (selectedIds.has(tagId)) {
                // Deselect
                const next = new Set(selectedIds);
                next.delete(tagId);
                setSelectedIds(next);
            } else {
                // Check if opposite is selected
                if (oppositeId && selectedIds.has(oppositeId)) {
                    const opp = tagMapRef.current[oppositeId];
                    setConflict({
                        tagName: tag.name,
                        oppositeName: opp?.name || '对立标签',
                        tagId, oppositeId,
                    });
                    return; // Block selection
                }
                const next = new Set(selectedIds);
                next.add(tagId);
                setSelectedIds(next);
            }
        }

        // Resolve conflict: deselect opposite and select current
        function resolveConflict(chooseCurrent) {
            if (!conflict) return;
            const next = new Set(selectedIds);
            if (chooseCurrent) {
                next.delete(conflict.oppositeId);
                next.add(conflict.tagId);
            } else {
                next.delete(conflict.tagId);
            }
            setSelectedIds(next);
            setConflict(null);
        }

        // Save preferences
        async function handleSave() {
            const count = selectedIds.size;
            if (count < config.min) {
                message.warning(`至少需要选择 ${config.min} 个标签，当前已选 ${count} 个`);
                return;
            }
            setSaving(true);
            try {
                const res = await fetch('/api/preferences/save.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag_ids: [...selectedIds], tier }),
                });
                const data = await res.json();
                if (data.success) { message.success(data.message); onBack(); }
                else { message.error(data.message); }
            } catch(e) { message.error('保存失败'); }
            finally { setSaving(false); }
        }

        // Add custom tag
        async function addCustomTag() {
            const name = customInput.trim();
            if (!name || name.length > 50) return;
            try {
                const res = await fetch('/api/preferences/custom-tag.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name }),
                });
                const data = await res.json();
                if (data.success) {
                    setCustomTags(prev => [...prev, data.tag]);
                    setCustomInput('');
                    message.success('自定义标签已添加');
                } else { message.error(data.message); }
            } catch(e) { message.error('添加失败'); }
        }

        async function removeCustomTag(tag) {
            try {
                await fetch('/api/preferences/custom-tag.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: tag.id }),
                });
                setCustomTags(prev => prev.filter(t => t.id !== tag.id));
            } catch(e) { message.error('删除失败'); }
        }

        // Calculate progress
        const count = selectedIds.size;
        const percent = Math.min(Math.round((count / config.min) * 100), 100);
        const isComplete = count >= config.min;

        // Get ALL category tags (not just selected) for display
        const categoryEntries = Object.entries(categories);

        return (
            <div className="pref-page">
                <div className="pref-header">
                    <div className="pref-header-inner">
                        <Space>
                            <Button type="text" icon={<ArrowLeftOutlined />} onClick={onBack} />
                            <span style={{ fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: 18 }}>旅游偏好选择</span>
                        </Space>
                        <Space>
                            <Tag color={isComplete ? 'success' : 'processing'}>{isComplete ? '已达标' : `还需${config.min - count}个`}</Tag>
                            <Button type="primary" icon={<SaveOutlined />} onClick={handleSave} loading={saving} size="large"
                                disabled={!isComplete}
                                style={{ borderRadius: 10, fontWeight: 600 }}>
                                保存偏好 ({count}/{config.min})
                            </Button>
                        </Space>
                    </div>
                </div>

                <div className="pref-layout">
                    {/* Sidebar */}
                    <div className="pref-sidebar">
                        <div className="pref-sidebar-card">
                            <h3>筛选层级</h3>
                            {Object.entries(TIER_CONFIG).map(([key, cfg]) => (
                                <button key={key}
                                    className={`tier-option${tier === key ? ' active' : ''}`}
                                    onClick={() => setTier(key)}>
                                    <div className="tier-name">{cfg.label}</div>
                                    <div className="tier-desc">{cfg.desc}</div>
                                </button>
                            ))}
                            <div style={{ marginTop: 20 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontSize: 13, color: 'var(--text-secondary)' }}>
                                    <span>完成度</span>
                                    <span>{count} / {config.min}+</span>
                                </div>
                                <Progress percent={percent} status={isComplete ? 'success' : 'active'}
                                    strokeColor={{ from: '#1565EF', to: '#0D9488' }} />
                            </div>
                            <div style={{ marginTop: 20 }}>
                                <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 8 }}>自定义标签</div>
                                <div style={{ display: 'flex', gap: 6 }}>
                                    <AntInput size="small" value={customInput} onChange={e => setCustomInput(e.target.value)}
                                        placeholder="输入自定义标签" style={{ borderRadius: 8 }}
                                        onPressEnter={addCustomTag} />
                                    <Button size="small" icon={<PlusOutlined />} onClick={addCustomTag}
                                        style={{ borderRadius: 8 }} />
                                </div>
                                <div className="pref-custom-chips">
                                    {customTags.map(t => (
                                        <span key={t.id} className="custom-chip">
                                            {t.name}
                                            <span className="remove-btn" onClick={() => removeCustomTag(t)}>×</span>
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Tag Area */}
                    <div className="pref-main">
                        {loading ? (
                            <div style={{ textAlign: 'center', padding: 80, background: '#FFF', borderRadius: 16 }}>
                                <Spin size="large" /><div style={{ marginTop: 16, color: 'var(--text-secondary)' }}>加载偏好标签...</div>
                            </div>
                        ) : (
                            <>
                                {conflict && (
                                    <div className="conflict-toast">
                                        <WarningFilled style={{ fontSize: 16 }} />
                                        <span>「{conflict.tagName}」与「{conflict.oppositeName}」互斥，只能选择其中一个。</span>
                                        <Button size="small" type="primary" danger onClick={() => resolveConflict(true)}
                                            style={{ marginLeft: 8, borderRadius: 6 }}>选当前</Button>
                                        <Button size="small" onClick={() => resolveConflict(false)}
                                            style={{ marginLeft: 4, borderRadius: 6 }}>保留原来的</Button>
                                    </div>
                                )}

                                {categoryEntries.map(([catName, tags]) => {
                                    const selInCat = tags.filter(t => selectedIds.has(t.id)).length;
                                    return (
                                        <div key={catName} className="pref-category">
                                            <h4>
                                                {catName}
                                                <span className="pref-cat-badge">{selInCat}/{tags.length}</span>
                                            </h4>
                                            <div className="pref-tags">
                                                {tags.map(tag => {
                                                    const isSelected = selectedIds.has(tag.id);
                                                    const isOppositeSel = tag.opposite_id && selectedIds.has(tag.opposite_id);
                                                    const isBlocked = !isSelected && isOppositeSel;
                                                    let cls = 'pref-tag';
                                                    if (isSelected) cls += ' selected';
                                                    else if (isBlocked) cls += ' blocked';

                                                    return (
                                                        <span key={tag.id}
                                                            className={cls}
                                                            onClick={() => !isBlocked && toggleTag(tag)}
                                                            title={isBlocked ? `与「${tagMapRef.current[tag.opposite_id]?.name || '对立标签'}」互斥` : ''}>
                                                            {isSelected && <CheckCircleFilled style={{ marginRight: 4 }} />}
                                                            {isBlocked && <WarningFilled style={{ marginRight: 4 }} />}
                                                            {tag.name}

                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}

    // ==================== Home Tab ====================
    function HomeTab({ user, onGoPrefs, onNavigate, onLocationUpdate }) {
        const mapContainerRef = useRef(null);
        const mapRef = useRef(null);
        const AMapRef = useRef(null);
        const markerRef = useRef(null);

        const sheetRef = useRef(null);
        const contentRef = useRef(null);
        const dragRef = useRef({ isDragging: false, startY: 0, startTranslate: 0, lastY: 0, lastTime: 0, velocity: 0 });
        const [locStatus, setLocStatus] = useState('loading');
        const [locLabel, setLocLabel] = useState('定位中...');
        const [refreshing, setRefreshing] = useState(false);
        const [sheetExpanded, setSheetExpanded] = useState(false);
        const [footprintData, setFootprintData] = useState(null);

        const sheetExpandedRef = useRef(false);

        const COLLAPSED_Y = 0;
        const EXPANDED_Y = -152;

        function snapSheet(expand) {
            const sheet = sheetRef.current;
            if (!sheet) return;
            sheet.style.transition = 'transform 380ms cubic-bezier(0.32, 0.72, 0, 1)';
            sheet.style.transform = `translateY(${expand ? EXPANDED_Y : COLLAPSED_Y}px)`;
            sheetExpandedRef.current = expand;
            setSheetExpanded(expand);
        }

        function startDrag(e, clientY) {
            const sheet = sheetRef.current;
            if (!sheet) return;
            const now = Date.now();
            dragRef.current = {
                isDragging: true,
                startY: clientY,
                startTranslate: sheetExpandedRef.current ? EXPANDED_Y : COLLAPSED_Y,
                lastY: clientY,
                lastTime: now,
                velocity: 0,
            };
            sheet.style.transition = 'none';
        }

        function moveDrag(clientY) {
            if (!dragRef.current.isDragging) return;
            const now = Date.now();
            const dt = now - dragRef.current.lastTime;
            if (dt > 0) dragRef.current.velocity = (clientY - dragRef.current.lastY) / dt;
            dragRef.current.lastY = clientY;
            dragRef.current.lastTime = now;
            const delta = clientY - dragRef.current.startY;
            let newY = dragRef.current.startTranslate + delta;
            newY = Math.max(EXPANDED_Y, Math.min(COLLAPSED_Y, newY));
            sheetRef.current.style.transform = `translateY(${newY}px)`;
        }

        function endDrag(clientY) {
            if (!dragRef.current.isDragging) return;
            dragRef.current.isDragging = false;
            const delta = clientY - dragRef.current.startY;
            const vel = dragRef.current.velocity;
            let expand;
            if (Math.abs(vel) > 0.3) {
                expand = vel < 0;
            } else {
                expand = sheetExpandedRef.current ? delta < 40 : delta < -40;
            }
            snapSheet(expand);
        }

        function onHandlePointerDown(e) {
            e.preventDefault();
            startDrag(e, e.clientY);
            e.currentTarget.setPointerCapture(e.pointerId);
        }
        function onHandlePointerMove(e) { moveDrag(e.clientY); }
        function onHandlePointerUp(e) { endDrag(e.clientY); }

        useEffect(() => {
            const content = contentRef.current;
            if (!content) return;
            let t0Y = 0, t0ScrollTop = 0, sheetDragging = false, sheetDragStartY = 0;

            function onTouchStart(e) {
                t0Y = e.touches[0].clientY;
                t0ScrollTop = content.scrollTop;
                sheetDragging = false;
            }

            function onTouchMove(e) {
                const dy = e.touches[0].clientY - t0Y;
                if (!sheetDragging) {
                    const goingDown = dy > 6;
                    const goingUp = dy < -6;
                    const atTop = t0ScrollTop <= 0;
                    const atBottom = content.scrollTop + content.clientHeight >= content.scrollHeight - 4;
                    if ((goingDown && atTop && sheetExpandedRef.current) || (goingUp && !sheetExpandedRef.current)) {
                        sheetDragging = true;
                        sheetDragStartY = e.touches[0].clientY;
                        startDrag(null, sheetDragStartY);
                    }
                }
                if (sheetDragging) {
                    e.preventDefault();
                    moveDrag(e.touches[0].clientY);
                }
            }

            function onTouchEnd(e) {
                if (!sheetDragging) return;
                sheetDragging = false;
                endDrag(e.changedTouches[0].clientY);
            }

            content.addEventListener('touchstart', onTouchStart, { passive: true });
            content.addEventListener('touchmove', onTouchMove, { passive: false });
            content.addEventListener('touchend', onTouchEnd, { passive: true });
            return () => {
                content.removeEventListener('touchstart', onTouchStart);
                content.removeEventListener('touchmove', onTouchMove);
                content.removeEventListener('touchend', onTouchEnd);
            };
        }, []);

        function placeMarker(AMap, map, lng, lat) {
            if (markerRef.current) { map.remove(markerRef.current); markerRef.current = null; }
            const marker = new AMap.Marker({
                position: [lng, lat],
                content: '<div style="width:18px;height:18px;border-radius:50%;background:#1565EF;border:3px solid #fff;box-shadow:0 0 0 5px rgba(21,101,239,0.22),0 2px 8px rgba(0,0,0,0.2)"></div>',
                offset: new AMap.Pixel(-9, -9),
                zIndex: 200,
            });
            map.add(marker);
            markerRef.current = marker;
        }

        // 加载足迹数据
        useEffect(() => {
            fetch('/api/footprint.php')
                .then(r => r.json())
                .then(data => { if (data.success) setFootprintData(data); })

        // 第一步：仅加载SDK，不创建地图
        useEffect(() => {
            if (!window.AMapLoader) { geoLog({ event: 'loader_missing', step: 'sdk', error: 'AMapLoader not found on window' }); setLocStatus('failed'); setLocLabel('地图未加载'); return; }
            let destroyed = false;

            async function init() {
                const t0 = Date.now();
                const browserGeoPerm = await checkBrowserGeoPermission();
                geoLog({ event: 'init_start', step: 'begin', detail: 'browser_geo_permission=' + browserGeoPerm });
                try {
                    setLocStatus('loading');
                    setLocLabel('定位中...');

                    const cfgResp = await fetch('/api/amap_jsapi_config.php');
                    const cfgData = await cfgResp.json();
                    const cfg = cfgData.config || {};
                    const hasKey = !!cfg.key;
                    const secType = cfg.serviceHost ? 'serviceHost' : (cfg.securityJsCode ? 'securityJsCode' : 'none');
                    geoLog({ event: 'config_fetched', step: 'config', config_ok: hasKey, security_type: secType, detail: JSON.stringify({ hasKey, secType, keyLen: (cfg.key||'').length }) });
                    if (!cfg.key) throw new Error('missing amap key');

                    if (cfg.serviceHost) {
                        window._AMapSecurityConfig = { serviceHost: cfg.serviceHost };
                    } else if (cfg.securityJsCode) {
                        window._AMapSecurityConfig = { securityJsCode: cfg.securityJsCode };
                    }

                    const t1 = Date.now();
                    const AMap = await window.AMapLoader.load({
                        key: cfg.key,
                        version: '2.0',
                        plugins: ['AMap.Geolocation', 'AMap.CitySearch'],
                    });
                    geoLog({ event: 'sdk_loaded', step: 'sdk', duration_ms: Date.now() - t1, sdk_loaded: !!AMap });
                    if (destroyed) return;
                    AMap.getConfig().appname = 'amap-jsapi-skill';
                    AMapRef.current = AMap;

                    const t2 = Date.now();
                    const coords = await getCoordinates(AMap);
                    geoLog({ event: 'coords_result', step: 'geolocation', type: coords?.type || 'none', lng: coords?.lng, lat: coords?.lat, duration_ms: Date.now() - t2 });
                    if (destroyed) return;

                    const center = coords ? [coords.lng, coords.lat] : [116.397, 39.908];
                    const zoom = coords ? 14 : 5;

                    const map = new AMap.Map(mapContainerRef.current, {
                        zoom,
                        center,
                        mapStyle: 'amap://styles/normal',
                    });
                    mapRef.current = map;

                    if (coords) {
                        placeMarker(AMap, map, coords.lng, coords.lat);
                        if (onLocationUpdate) onLocationUpdate({ lng: coords.lng, lat: coords.lat });
                        setLocStatus(coords.type);
                        setLocLabel(coords.type === 'gps' ? 'GPS 定位' : 'IP 定位');
                    } else {
                        setLocStatus('failed');
                        setLocLabel('定位失败');
                    }
                    setRefreshing(false);
                    geoLog({ event: 'init_done', step: 'complete', status: coords?.type || 'failed', duration_ms: Date.now() - t0 });
                } catch (e) {
                    geoLog({ event: 'init_error', step: 'exception', error: e.message || String(e), detail: e.stack?.substring(0, 300) || '', duration_ms: Date.now() - t0 });
                    if (!destroyed) { setLocStatus('failed'); setLocLabel('地图加载失败'); setRefreshing(false); }
                }
            }

            function getCoordinates(AMap) {
                return new Promise((resolve) => {
                    let done = false;
                    const t0 = Date.now();
                    const finish = (result) => {
                        if (done) return; done = true;
                        geoLog({ event: 'getCoords_finish', step: 'getCoordinates', type: result?.type || 'none', lng: result?.lng, lat: result?.lat, duration_ms: Date.now() - t0 });
                        resolve(result);
                    };

                    const hardTimer = setTimeout(() => {
                        geoLog({ event: 'getCoords_timeout', step: 'getCoordinates', error: 'hard_timeout_12s', duration_ms: Date.now() - t0 });
                        finish(null);
                    }, 12000);

                    // Tier 1: Browser native Geolocation API
                    if (navigator.geolocation) {
                        geoLog({ event: 'browser_gps_attempt', step: 'browser_gps', detail: 'navigator.geolocation.getCurrentPosition' });
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                geoLog({ event: 'browser_gps_ok', step: 'browser_gps', lng: pos.coords.longitude, lat: pos.coords.latitude, detail: 'accuracy=' + pos.coords.accuracy });
                                clearTimeout(hardTimer);
                                finish({ lng: pos.coords.longitude, lat: pos.coords.latitude, type: 'gps' });
                            },
                            (err) => {
                                geoLog({ event: 'browser_gps_err', step: 'browser_gps', error: err.message, errorCode: err.code });
                                // Tier 2: Free IP geolocation service
                                tryIPGeolocation();
                            },
                            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                        );
                    } else {
                        geoLog({ event: 'browser_gps_unavailable', step: 'browser_gps', error: 'navigator.geolocation not available' });
                        tryIPGeolocation();
                    }

                    // Tier 2: Server-side IP geolocation
                    function tryIPGeolocation() {
                        geoLog({ event: 'ipapi_attempt', step: 'ipapi' });
                        fetch('/api/ip_location.php')
                            .then(r => r.json())
                            .then(data => {
                                if (data.success && data.lng != null && data.lat != null) {
                                    geoLog({ event: 'ipapi_ok', step: 'ipapi', lng: data.lng, lat: data.lat, detail: 'city=' + (data.city||'') + ' ip=' + (data.ip||'') });
                                    clearTimeout(hardTimer);
                                    finish({ lng: data.lng, lat: data.lat, type: 'ip' });
                                } else {
                                    geoLog({ event: 'ipapi_fail', step: 'ipapi', error: data.message || 'no coords' });
                                    tryAMapCitySearch();
                                }
                            })
                            .catch((e) => {
                                geoLog({ event: 'ipapi_err', step: 'ipapi', error: e.message });
                                tryAMapCitySearch();
                            });
                    }

                    // Tier 3: AMap CitySearch (fallback)
                    function tryAMapCitySearch() {
                        geoLog({ event: 'citysearch_attempt', step: 'citysearch' });
                        try {
                            const city = new AMap.CitySearch();
                            city.getLocalCity((s2, r2) => {
                                const csDetail = r2 ? JSON.stringify({ status: s2, hasBounds: !!(r2.bounds), info: r2.info, city: r2.city, province: r2.province }).substring(0, 300) : 'null_result';
                                geoLog({ event: 'citysearch_callback', step: 'citysearch', status: s2, error: r2?.info || '', detail: csDetail });
                                clearTimeout(hardTimer);
                                if (s2 === 'complete' && r2 && r2.bounds) {
                                    const center = r2.bounds.getCenter();
                                    finish({ lng: center.getLng(), lat: center.getLat(), type: 'ip' });
                                } else {
                                    finish(null);
                                }
                            });
                        } catch (e) {
                            geoLog({ event: 'citysearch_error', step: 'citysearch', error: e.message });
                            clearTimeout(hardTimer);
                            finish(null);
                        }
                    }
                });
            }

            init();

            return () => {
                destroyed = true;
                if (mapRef.current) { mapRef.current.destroy(); mapRef.current = null; }
            };
        }, []);

        function handleRefresh() {
            if (!AMapRef.current || !mapRef.current || refreshing) return;
            const AMap = AMapRef.current;
            const map = mapRef.current;
            const t0 = Date.now();
            geoLog({ event: 'refresh_start', step: 'refresh' });
            setRefreshing(true);
            setLocStatus('loading');
            setLocLabel('定位中...');

            let done = false;
            const finish = (status, label, lng, lat) => {
                if (done) return; done = true;
                geoLog({ event: 'refresh_done', step: 'refresh', type: status, lng, lat, duration_ms: Date.now() - t0 });
                setLocStatus(status);
                setLocLabel(label);
                setRefreshing(false);
                if (lng != null && lat != null) {
                    map.setCenter([lng, lat]);
                    map.setZoom(14);
                    placeMarker(AMap, map, lng, lat);
                    if (onLocationUpdate) onLocationUpdate({ lng, lat });
                }
            };

            const hardTimer = setTimeout(() => {
                geoLog({ event: 'refresh_timeout', step: 'refresh', error: 'hard_timeout_12s', duration_ms: Date.now() - t0 });
                finish('failed', '定位超时');
            }, 12000);

            // Tier 1: Browser native GPS
            if (navigator.geolocation) {
                geoLog({ event: 'refresh_browser_gps', step: 'refresh' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        geoLog({ event: 'refresh_browser_gps_ok', step: 'refresh', lng: pos.coords.longitude, lat: pos.coords.latitude });
                        clearTimeout(hardTimer);
                        finish('gps', 'GPS 定位', pos.coords.longitude, pos.coords.latitude);
                    },
                    (err) => {
                        geoLog({ event: 'refresh_browser_gps_err', step: 'refresh', error: err.message, errorCode: err.code });
                        refreshIPFallback();
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            } else {
                refreshIPFallback();
            }

            // Tier 2: Server-side IP geolocation
            function refreshIPFallback() {
                geoLog({ event: 'refresh_ipapi', step: 'refresh' });
                fetch('/api/ip_location.php')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.lng != null && data.lat != null) {
                            geoLog({ event: 'refresh_ipapi_ok', step: 'refresh', lng: data.lng, lat: data.lat });
                            clearTimeout(hardTimer);
                            finish('ip', 'IP 定位', data.lng, data.lat);
                        } else {
                            refreshCitySearch();
                        }
                    })
                    .catch(() => refreshCitySearch());
            }

            // Tier 3: AMap CitySearch
            function refreshCitySearch() {
                geoLog({ event: 'refresh_citysearch', step: 'refresh' });
                try {
                    const city = new AMap.CitySearch();
                    city.getLocalCity((s, r) => {
                        geoLog({ event: 'refresh_citysearch_cb', step: 'refresh', status: s, error: r?.info || '' });
                        clearTimeout(hardTimer);
                        if (s === 'complete' && r && r.bounds) {
                            const c = r.bounds.getCenter();
                            finish('ip', 'IP 定位', c.getLng(), c.getLat());
                        } else {
                            finish('failed', '定位失败');
                        }
                    });
                } catch (e) {
                    geoLog({ event: 'refresh_citysearch_err', step: 'refresh', error: e.message });
                    clearTimeout(hardTimer);
                    finish('failed', '定位失败');
                }
            }
        }


        const statusIcon = locStatus === 'loading' ? <LoadingOutlined /> : <EnvironmentOutlined />;

        return (

    // Shared AMap loader (used by AITab LocationCard and FootprintsPage)
    let _amapLib = null;

    function getAMap() {
        if (_amapLib) return Promise.resolve(_amapLib);
        if (_amapLoading) return _amapLoading;
        _amapLoading = (async () => {
            try {
                const res = await fetch('/api/amap_jsapi_config.php');
                const data = await res.json();
                const cfg = data.config || {};
                if (!cfg.key) throw new Error('no key');
                if (cfg.serviceHost) window._AMapSecurityConfig = { serviceHost: cfg.serviceHost };
                else if (cfg.securityJsCode) window._AMapSecurityConfig = { securityJsCode: cfg.securityJsCode };
                _amapLib = await window.AMapLoader.load({ key: cfg.key, version: '2.0' });
                return _amapLib;
            } catch { return null; }
        })();
        return _amapLoading;
    }

        function renderMd(text) {
            try { return { __html: marked.parse(text || '', { breaks: true, gfm: true }) }; }
            catch { return { __html: text }; }
        }

        function parseContent(text) {
            if (!text) return [{ type: 'text', value: '' }];
            // Parse all code block types: location, tool_call, itinerary, comparison, travel_tip
            const parts = text.split(/```(location|tool_call|itinerary|comparison|travel_tip)\s*\n([\s\S]*?)\s*```/g);
            const segments = [];
            for (let i = 0; i < parts.length; i++) {
                if (i % 3 === 0) {
                    if (parts[i] && parts[i].trim()) segments.push({ type: 'text', value: parts[i] });
                } else {
                    const blockType = parts[i];
                    const blockContent = parts[i + 1];
                    i++; // skip content, we consumed 3 parts
                    try {
                        const data = JSON.parse(blockContent);
                        if (blockType === 'location' && data.name) {
                            segments.push({ type: 'location', value: data });
                        } else if (blockType === 'tool_call' && data.tool) {
                            segments.push({ type: 'tool_call', value: data });
                        } else if (blockType === 'itinerary' && data.days) {
                            segments.push({ type: 'itinerary', value: data });
                        } else if (blockType === 'comparison' && data.items) {
                            segments.push({ type: 'comparison', value: data });
                        } else if (blockType === 'travel_tip' && data.content) {
                            segments.push({ type: 'travel_tip', value: data });
                        } else {
                            segments.push({ type: 'text', value: '```' + blockType + '\n' + blockContent + '\n```' });
                        }
                    } catch {
                        segments.push({ type: 'text', value: '```' + blockType + '\n' + blockContent + '\n```' });
                    }
                }
            }
            return segments.length ? segments : [{ type: 'text', value: text }];
        }

        }

        function LocationCard({ loc }) {

            }, [loc.location]);

            const handleSave = async () => {
