        async function sendMessage(continueParams) {
            const isContinue = !!continueParams;
            // Read from DOM directly to avoid mobile IME/react state lag
            const domText = textareaRef.current?.value || inputText;
            const text = isContinue ? '' : domText.trim();
            if (!isContinue && !text && attachedFiles.length === 0) return;
            if (!isContinue && loading) return; // Allow continue calls to bypass loading guard

            // Build user message (skip for continue mode)
            if (!isContinue) {
                const userMsg = { role: 'user', content: text, favorite: selectedFavorite, attachments: attachedFiles.map(f => ({ name: f.name, type: f.type })) };
                setMessages(prev => [...prev, userMsg]);
                setInputText('');
                // Clear DOM textarea manually for instant feedback on mobile
                if (textareaRef.current) textareaRef.current.value = '';
            }
            setLoading(true);
            setStatusText('');

            // Web search if enabled (first turn only)
            let searchResults = '';
            let searchResultsRaw = null;
            if (!isContinue && searchEnabled && text) {
                setStatusText('正在搜索互联网...');
                try {
                    const sResp = await fetch('/api/web_search.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: text }),
                    });
                    const sData = await sResp.json();
                    if (sData.success && sData.results?.length > 0) {
                        searchResultsRaw = sData.results;
                        searchResults = sData.results.map((r, i) => `${i + 1}. ${r.title}\n${r.snippet}`).join('\n\n');
                    }
                } catch {}
            }

            const formData = new FormData();
            if (isContinue) {
                formData.append('continue', '1');
                formData.append('message', '继续');
                formData.append('session_id', sessionIdRef.current || sessionId);
                formData.append('previous_tool_results', JSON.stringify(continueParams.toolResults));
            } else {
                if (text) formData.append('message', text);
                if (selectedFavorite) formData.append('favorite', JSON.stringify(selectedFavorite));
                if (sessionId) formData.append('session_id', sessionId);
                if (searchResults) formData.append('search_results', searchResults);
                if (searchResultsRaw) formData.append('search_results_json', JSON.stringify(searchResultsRaw));
                if (userLocation) formData.append('user_lng', userLocation.lng);
                if (userLocation) formData.append('user_lat', userLocation.lat);
                attachedFiles.forEach(f => formData.append('attachments[]', f));
            }
            setAttachedFiles([]);
            setSelectedFavorite(null);

            // Use or create AI message tag
            const aiMsgTag = isContinue ? continueParams.aiMsgTag : Date.now();
            if (!isContinue) {
                aiContentRef.current = '';
                setMessages(prev => [...prev, { role: 'ai', content: '', think: '', searchResults: searchResultsRaw, toolResults: [], _tag: aiMsgTag }]);
            }

            // For continue, prepend existing content + tool divider
            const priorContent = isContinue ? aiContentRef.current : '';
            let fullText = priorContent ? priorContent + '\n\n---\n\n' : '';
            let fullThink = '';
            const updateAiMsg = (updates) => {
                setMessages(prev => {
                    const n = [...prev];
                    const idx = n.findIndex(m => m._tag === aiMsgTag);
                    if (idx >= 0) n[idx] = { ...n[idx], ...updates };
                    return n;
                });
            };

            let hasPendingContinue = false;
            // Safety timeout: force clear loading after 120s no matter what
            const safetyTimer = setTimeout(() => {
                if (!hasPendingContinue) { setLoading(false); setStatusText(''); }
            }, 120000);
            try {
                try {
                    const resp = await fetch('/api/ai_chat_stream.php', { method: 'POST', body: formData });
                    const reader = resp.body.getReader();
                    const dec = new TextDecoder();
                    let buf = '';

                    const parseEvents = (chunk) => {
                        buf += chunk;
                        const parts = buf.split('\n\n');
                        buf = parts.pop();
                        for (const block of parts) {
                            let evtType = '', evtData = '';
                            for (const line of block.split('\n')) {
                                if (line.startsWith('event: ')) evtType = line.slice(7).trim();
                                else if (line.startsWith('data: ')) evtData = line.slice(6).trim();
                            }
                            if (!evtType || !evtData) continue;
                            try {
                                const d = JSON.parse(evtData);
                                if (evtType === 'session') {
                                    sessionIdRef.current = d.session_id;
                                    setSessionId(d.session_id);
                                    setSessionTitle(d.title || '新对话');
                                } else if (evtType === 'title') {
                                    setSessionTitle(d.title);
                                } else if (evtType === 'status') {
                                    setStatusText(d.message || '');
                                } else if (evtType === 'think') {
                                    fullThink += d.text || '';
                                    updateAiMsg({ think: fullThink });
                                } else if (evtType === 'delta') {
                                    fullText += d.text || '';
                                    updateAiMsg({ content: fullText });
                                } else if (evtType === 'done') {
                                    if (d.session_id) { sessionIdRef.current = d.session_id; setSessionId(d.session_id); }
                                    setStatusText('');
                                } else if (evtType === 'error') {
                                    message.error(d.message || 'AI 回答失败');
                                    setStatusText('');
                                }
                            } catch {}
                        }
                    };

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        parseEvents(dec.decode(value, { stream: true }));
                    }

                    if (fullText === priorContent + '\n\n---\n\n' && fullThink === '') {
                        updateAiMsg({ content: priorContent || '暂无回答，请稍后重试' });
                    }
                } catch {
                    message.error('网络错误，请重试');
                    if (!isContinue) updateAiMsg({ content: '网络错误，请稍后重试' });
                }

                // Track final content
                aiContentRef.current = fullText;

                // After streaming, check for tool_calls (max 3 rounds to prevent infinite loops)
                const toolRound = (continueParams && continueParams.toolRound) || 0;
                if (toolRound < 3) {
                    // For continue, only parse new content after the last separator
                    const textToParse = isContinue ? fullText.split('\n\n---\n\n').pop() : fullText;
                    const segments = parseContent(textToParse);
                    const toolCalls = segments.filter(s => s.type === 'tool_call');

                    if (toolCalls.length > 0) {
                        if (!isContinue) {
                            // Remove tool_call blocks from displayed text
                            const cleanContent = segments
                                .filter(s => s.type !== 'tool_call')
                                .map(s => {
                                    if (s.type === 'text') return s.value;
                                    if (s.type === 'location') return '```location\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'itinerary') return '```itinerary\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'comparison') return '```comparison\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'travel_tip') return '```travel_tip\n' + JSON.stringify(s.value) + '\n```';
                                    return '';
                                }).join('\n\n');
                            updateAiMsg({ content: cleanContent });
                            aiContentRef.current = cleanContent;
                        } else {
                            // For continue, also strip tool_call blocks from new content only
                            const newClean = segments
                                .filter(s => s.type !== 'tool_call')
                                .map(s => {
                                    if (s.type === 'text') return s.value;
                                    if (s.type === 'location') return '```location\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'itinerary') return '```itinerary\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'comparison') return '```comparison\n' + JSON.stringify(s.value) + '\n```';
                                    if (s.type === 'travel_tip') return '```travel_tip\n' + JSON.stringify(s.value) + '\n```';
                                    return '';
                                }).join('\n\n');
                            // Replace the last segment of fullText with cleaned version
                            const parts = fullText.split('\n\n---\n\n');
                            parts[parts.length - 1] = newClean;
                            const cleanedFull = parts.join('\n\n---\n\n');
                            updateAiMsg({ content: cleanedFull });
                            aiContentRef.current = cleanedFull;
                        }

                        // Get existing tool results for accumulation on continue
                        const existingResults = isContinue ? (continueParams.existingToolResults || []) : [];

                        // Execute each tool call
                        const newResults = [];
                        for (const tc of toolCalls.slice(0, 3)) {
                            setLoading(true);
                            setStatusText(`正在执行: ${tc.value.tool}...`);
                            const allResults = [...existingResults, ...newResults, { tool: tc.value.tool, status: 'loading' }];
                            updateAiMsg({ toolResults: allResults });
                            try {
                                const tResp = await fetch('/api/ai_tool_exec.php', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ tool: tc.value.tool, params: tc.value.params }),
                                });
                                const tData = await tResp.json();
                                newResults.push({ tool: tc.value.tool, params: tc.value.params, result: tData.success ? tData.result : null, error: tData.error || null, status: 'done' });
                            } catch (e) {
                                newResults.push({ tool: tc.value.tool, params: tc.value.params, result: null, error: '网络错误', status: 'done' });
                            }
                            const doneResults = [...existingResults, ...newResults];
                            updateAiMsg({ toolResults: doneResults });
                        }
                        setStatusText('');

                        const accumulatedResults = [...existingResults, ...newResults];

                        // Auto-trigger continue — keep loading=true throughout
                        hasPendingContinue = true;
                        setTimeout(() => {
                            sendMessage({ toolResults: accumulatedResults, aiMsgTag, toolRound: toolRound + 1, existingToolResults: accumulatedResults });
                        }, 300);
                    }
                }
            } finally {
                clearTimeout(safetyTimer);
                if (!hasPendingContinue) {
                    setLoading(false);
                    setStatusText('');
                }
            }
        }

        function handleKeyDown(e) {
            // Ignore during IME composition (mobile Chinese input)
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }

            if (!t) return '';

            if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        return (

                <div className="ai-messages">
                    {messages.length === 0 && (

                            <h3>AI 旅行助手</h3>
                            <p>问我任何旅行问题，可以收藏地点一起发送</p>
                        </div>
                    )}
                    {messages.map((msg, i) => {

    // ==================== Footprints Page ====================
    function FootprintsPage({ onBack, user }) {
        const [provinces, setProvinces] = useState([]);
        const [records, setRecords] = useState([]);
        const [loading, setLoading] = useState(true);
        const [generating, setGenerating] = useState(false);
        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => { loadFootprints(); }, []);

        async function loadFootprints() {
            setLoading(true);
            try {
                const res = await fetch('/api/footprint.php');
                const data = await res.json();
                if (data.success) {
                    setProvinces(data.provinces || []);
                    setRecords(data.records || []);
                } else {
                    message.error(data.message || '获取足迹失败');
                }
            } catch { message.error('网络错误，请重试'); }
            setLoading(false);
        }

        useEffect(() => {
            if (loading || !chartRef.current || !window.echarts) return;
            let destroyed = false;
            initChart();
            return () => {
                destroyed = true;
                if (chartInstance.current) { chartInstance.current.dispose(); chartInstance.current = null; }
            };
            async function initChart() {
                let geoData;
                try {
                    const geoRes = await fetch('/assets/china_provinces.json');
                    if (!geoRes.ok) throw new Error('GeoJSON fetch failed');
                    geoData = await geoRes.json();
                    if (destroyed) return;
                    window.echarts.registerMap('china', geoData);
                } catch {
                    return; // GeoJSON optional, degrade gracefully
                }
                if (destroyed) return;
                const chart = window.echarts.init(chartRef.current);
                chartInstance.current = chart;
                const visitedSet = new Set(provinces.map(p => normalizeProvinceName(p)));
                const mapData = geoData.features.map(f => {
                    const name = f.properties.name;
                    const shortName = normalizeProvinceName(name);
                    const isVisited = visitedSet.has(shortName);
                    return { name: name, value: isVisited ? 1 : 0 };
                });
                chart.setOption({
                    tooltip: {
                        trigger: 'item',
                        formatter: function(params) {
                            if (params.data && params.data.value === 1) return params.name + '<br/>已探访';
                            return params.name;
                        },
                    },
                    visualMap: {
                        show: false,
                        min: 0,
                        max: 1,
                        inRange: { color: ['#E2E8F0', '#059669'] },
                    },
                    series: [{
                        type: 'map',
                        map: 'china',
                        roam: false,
                        label: { show: false },
                        emphasis: {
                            label: { show: true, color: '#fff', fontSize: 11 },
                            itemStyle: { areaColor: '#047857' },
                        },
                        itemStyle: {
                            borderColor: '#94A3B8',
                            borderWidth: 0.8,
                        },
                        data: mapData,
                    }],
                });
                window.addEventListener('resize', () => chart.resize());
            }
        }, [loading, provinces]);

        async function handleGenerateCard() {
            if (!window.echarts || !window.html2canvas) {
                message.error('组件加载中，请稍后重试');
                return;
            }
            setGenerating(true);
            try {
                let geoData;
                try {
                    const geoRes = await fetch('/assets/china_provinces.json');
                    geoData = await geoRes.json();
                    window.echarts.registerMap('china', geoData);
                } catch {
                    message.error('地图数据加载失败');
                    setGenerating(false);
                    return;
                }

                const card = document.createElement('div');
                card.style.cssText = 'position:fixed;left:-9999px;top:0;width:375px;background:#fff;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;';
                card.innerHTML = '<div style="background:linear-gradient(135deg,#059669,#10B981);padding:24px 20px 20px;color:#fff;">'
                    + '<div style="font-size:20px;font-weight:800;">我的足迹</div>'
                    + '<div style="font-size:13px;opacity:0.85;margin-top:4px;">已探访 ' + provinces.length + ' 个省份</div>'
                    + '</div>'
                    + '<div id="card-map" style="width:375px;height:280px;"></div>'
                    + '<div style="padding:12px 20px 16px;">'
                    + '<div style="display:flex;flex-wrap:wrap;gap:6px;">'
                    + provinces.map(function(p) {
                        return '<span style="display:inline-block;padding:4px 12px;background:#ECFDF5;color:#059669;border-radius:999px;font-size:12px;font-weight:600;">' + p + '</span>';
                    }).join('')
                    + '</div>'
                    + '</div>'
                    + '<div style="padding:10px 20px;border-top:1px solid #F1F5F9;display:flex;justify-content:space-between;align-items:center;">'
                    + '<span style="font-size:11px;color:#94A3B8;">UMap · 探索世界</span>'
                    + '<span style="font-size:11px;color:#94A3B8;">' + new Date().toLocaleDateString('zh-CN') + '</span>'
                    + '</div>';
                document.body.appendChild(card);

                const mapDiv = card.querySelector('#card-map');
                const chart = window.echarts.init(mapDiv);
                const visitedSet = new Set(provinces.map(function(p) { return normalizeProvinceName(p); }));
                const mapData = geoData.features.map(function(f) {
                    var name = f.properties.name;
                    var shortName = normalizeProvinceName(name);
                    return { name: name, value: visitedSet.has(shortName) ? 1 : 0 };
                });
                chart.setOption({
                    visualMap: { show: false, min: 0, max: 1, inRange: { color: ['#E2E8F0', '#059669'] } },
                    series: [{
                        type: 'map', map: 'china', roam: false,
                        label: { show: false },
                        itemStyle: { borderColor: '#94A3B8', borderWidth: 0.8 },
                        data: mapData,
                    }],

                const canvas = await html2canvas(card, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    width: 375,
                });

                chart.dispose();
                document.body.removeChild(card);

                const link = document.createElement('a');
                link.download = '我的足迹_' + new Date().toISOString().slice(0, 10) + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                message.success('卡片已保存');
            } catch (e) {
                message.error('生成卡片失败');
            }
            setGenerating(false);
        }

        return (
            <div className="sub-page">
                <div className="sub-page-header">
                    <button className="sub-page-back" onClick={onBack}><ArrowLeftOutlined /></button>
                    <span className="sub-page-title">我的足迹</span>
                    {provinces.length > 0 && (
                        <button style={{ marginLeft: 'auto', border: 'none', background: 'none', fontSize: 13, color: 'var(--primary)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer', padding: '6px 12px', borderRadius: 8 }}

                <div className="sub-page-content" style={{ padding: 0, maxWidth: 'none' }}>
                    {loading ? (

                        <>
                            <div className="footprint-stats">
                                <div className="footprint-stat-card">
                                    <div className="footprint-stat-num">{provinces.length}</div>
                                    <div className="footprint-stat-label">已探访省份</div>
                                </div>
                            </div>
                            <div ref={chartRef} className="footprint-map" />
                            {provinces.length > 0 && (

                                    <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-primary)', padding: '16px 0 10px' }}>已探访省份</div>

                                        <div key={p} className="footprint-province-item">
                                            <span className="footprint-province-name">{p}</span>

                                    <EnvironmentOutlined style={{ fontSize: 40, marginBottom: 12 }} />
                                    <div>暂无足迹记录</div>
                                    <div style={{ fontSize: 12, marginTop: 4 }}>访问网站时会自动记录你的位置</div>

    // ==================== Account Settings Page ====================
    function AccountSettingsPage({ user, onBack }) {
        const [pwForm, setPwForm] = useState({ current: '', newPw: '', confirm: '' });
        const [saving, setSaving] = useState(false);
        const [msg, setMsg] = useState(null);

        async function handleChangePw() {
            if (!pwForm.current || !pwForm.newPw || !pwForm.confirm) {
                setMsg({ type: 'error', text: '请填写所有字段' }); return;
            }
            if (pwForm.newPw !== pwForm.confirm) {
                setMsg({ type: 'error', text: '两次密码不一致' }); return;
            }
            if (pwForm.newPw.length < 6) {
                setMsg({ type: 'error', text: '新密码至少6位' }); return;
            }
            setSaving(true); setMsg(null);
            try {
                const res = await fetch('/api/change_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: pwForm.current, new_password: pwForm.newPw }),
                });
                const data = await res.json();
                if (data.success) {
                    setMsg({ type: 'success', text: '密码修改成功' });
                    setPwForm({ current: '', newPw: '', confirm: '' });
                } else {
                    setMsg({ type: 'error', text: data.message || '修改失败' });
                }
            } catch { setMsg({ type: 'error', text: '网络错误，请重试' }); }
            setSaving(false);
        }

        return (
            <div className="sub-page">
                <div className="sub-page-header">
                    <button className="sub-page-back" onClick={onBack}><ArrowLeftOutlined /></button>
                    <span className="sub-page-title">账号设置</span>
                </div>
                <div className="sub-page-content">
                    <div className="settings-section">
                        <div className="settings-section-title">账号信息</div>
                        <div className="settings-card">
                            <div className="settings-row">
                                <span className="settings-label">用户名</span>
                                <span className="settings-value">{user.username}</span>
                            </div>
                            <div className="settings-row">
                                <span className="settings-label">邮箱</span>
                                <span className="settings-value">{user.email}</span>
                            </div>
                        </div>
                    </div>
                    <div className="settings-section">
                        <div className="settings-section-title">修改密码</div>
                        <div className="settings-card">
                            {msg && <div className={`settings-msg ${msg.type}`}>{msg.text}</div>}
                            <div className="settings-field">
                                <label>当前密码</label>
                                <input type="password" placeholder="输入当前密码" value={pwForm.current}
                                    onChange={e => setPwForm(p => ({ ...p, current: e.target.value }))} />
                            </div>
                            <div className="settings-field">
                                <label>新密码</label>
                                <input type="password" placeholder="至少6位" value={pwForm.newPw}
                                    onChange={e => setPwForm(p => ({ ...p, newPw: e.target.value }))} />
                            </div>
                            <div className="settings-field">
                                <label>确认新密码</label>
                                <input type="password" placeholder="再次输入新密码" value={pwForm.confirm}
                                    onChange={e => setPwForm(p => ({ ...p, confirm: e.target.value }))} />
                            </div>
                            <button className="settings-btn-primary" onClick={handleChangePw} disabled={saving}>
                                {saving ? '保存中...' : '保存修改'}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== City Search Page ====================
    const SEARCH_STEPS = [
        { id: 1, label: 'AI 正在分析喜好' },
        { id: 2, label: '高德地图补充详情' },
    ];

    function CitySearchPage({ onBack, initialCity }) {
        const [city, setCity] = useState(initialCity || '');
        const [loading, setLoading] = useState(false);
        const [loadingMore, setLoadingMore] = useState(false);
        const [attractions, setAttractions] = useState([]);
        const [searched, setSearched] = useState(false);
        const [favorites, setFavorites] = useState(new Set());
        const [feedbackMenu, setFeedbackMenu] = useState(null);
        const [feedbacks, setFeedbacks] = useState({});
        const [stepStates, setStepStates] = useState({ 1: 'pending', 2: 'pending' });
        const [stepDetails, setStepDetails] = useState({ 1: '', 2: '' });
        const [hasMore, setHasMore] = useState(false);
        const [nextPage, setNextPage] = useState(2);
        const inputRef = useRef(null);
        const loadMoreRef = useRef(null);
        const currentCityRef = useRef('');

        useEffect(() => {
            if (inputRef.current) inputRef.current.focus();
            loadFavoriteNames();
            loadFeedbacks();
            if (initialCity && initialCity.trim()) doSearch(initialCity.trim(), 1);
        }, []);

        async function loadFavoriteNames() {
            try {
                const res = await fetch('/api/favorites.php');
                const data = await res.json();
                if (data.success) setFavorites(new Set((data.favorites || []).map(i => i.name)));
            } catch {}
        }

        async function loadFeedbacks() {
            try {
                const res = await fetch('/api/attraction_feedback.php');
                const data = await res.json();
                if (data.success) {
                    const map = {};
                    (data.items || []).forEach(i => { map[i.name] = i.feedback_type; });
                    setFeedbacks(map);
                }
            } catch {}
        }

        useEffect(() => {
            if (!hasMore || loading || loadingMore) return;
            const obs = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting) loadMore();
            }, { threshold: 0.1 });
            if (loadMoreRef.current) obs.observe(loadMoreRef.current);
            return () => obs.disconnect();
        }, [hasMore, loading, loadingMore, nextPage]);

        async function doSearch(cityName, page) {
            const isFirst = page === 1;
            if (isFirst) {
                setLoading(true);
                setSearched(true);
                setAttractions([]);
                setHasMore(false);
                setNextPage(2);
                setStepStates({ 1: 'pending', 2: 'pending' });
                setStepDetails({ 1: '', 2: '' });
            } else {
                setLoadingMore(true);
            }
            currentCityRef.current = cityName;

            try {
                const resp = await fetch('/api/city_search_stream.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city: cityName, page }),
                });

                const reader = resp.body.getReader();
                const dec = new TextDecoder();
                let buf = '';

                const parseEvents = (chunk) => {
                    buf += chunk;
                    const parts = buf.split('\n\n');
                    buf = parts.pop();
                    for (const block of parts) {
                        let evtType = '', evtData = '';
                        for (const line of block.split('\n')) {
                            if (line.startsWith('event: ')) evtType = line.slice(7).trim();
                            else if (line.startsWith('data: ')) evtData = line.slice(6).trim();
                        }
                        if (!evtType || !evtData) continue;
                        try {
                            const d = JSON.parse(evtData);
                            if (evtType === 'status') {
                                const s = d.step;
                                setStepStates(prev => ({ ...prev, [s]: d.done ? 'done' : 'active' }));
                                setStepDetails(prev => ({ ...prev, [s]: d.message }));
                            } else if (evtType === 'attraction') {
                                setAttractions(prev => [...prev, d]);
                            } else if (evtType === 'done') {
                                setHasMore(d.hasMore);
                                setNextPage(d.nextPage);
                            } else if (evtType === 'error') {
                                message.error(d.message || '搜索失败');
                            }
                        } catch {}
                    }
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    parseEvents(dec.decode(value, { stream: true }));
                }
            } catch { message.error('网络错误，请重试'); }

            if (isFirst) setLoading(false);
            else setLoadingMore(false);
        }

        function search(overrideCity) {
            const c = (overrideCity || city).trim();
            if (!c || loading) return;
            doSearch(c, 1);
        }

        function loadMore() {
            if (loadingMore || loading) return;
            doSearch(currentCityRef.current, nextPage);
        }

        async function toggleFavorite(e, attraction) {
            e.stopPropagation();
            const name = attraction.name;
            const isFav = favorites.has(name);
            try {
                const res = await fetch('/api/favorites.php', {
                    method: isFav ? 'DELETE' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...attraction, city: currentCityRef.current || city }),
                });
                const data = await res.json();
                if (!data.success) { message.error(data.message || '操作失败'); return; }
                setFavorites(prev => { const n = new Set(prev); isFav ? n.delete(name) : n.add(name); return n; });
                message.success(isFav ? '已取消收藏' : '已收藏');
            } catch { message.error('网络错误，请重试'); }
        }

        async function submitFeedback(e, attraction, type) {
            e.stopPropagation();
            setFeedbackMenu(null);
            try {
                const res = await fetch('/api/attraction_feedback.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...attraction, city: currentCityRef.current || city, type }),
                });
                const data = await res.json();
                if (!data.success) { message.error(data.message || '操作失败'); return; }
                setFeedbacks(prev => ({ ...prev, [attraction.name]: type }));
                message.success(type === 'like' ? '已点赞，会用于后续推荐' : '已踩，以后会减少类似推荐');
            } catch { message.error('网络错误，请重试'); }
        }

        function navigate(e, a) {
            e.stopPropagation();
            const cityName = currentCityRef.current || city;
            openAmapNav(a.name, a.location, cityName);
        }

        const showProgress = loading || (searched && (stepStates[1] !== 'pending' || stepStates[2] !== 'pending' || stepStates[3] !== 'pending'));

        return (
            <div className="city-search-page">
                <div className="city-search-header">
                    <button className="sub-page-back" onClick={onBack}><ArrowLeftOutlined /></button>
                    <div className="city-search-input-wrap">
                        <SearchOutlined className="city-search-input-icon" />
                        <input
                            ref={inputRef}
                            className="city-search-input"
                            placeholder="输入城市名称，如：北京、上海..."
                            value={city}
                            onChange={e => setCity(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && search()}
                        />
                    </div>
                    <button className="city-search-btn" onClick={() => search()} disabled={loading}>{loading ? '搜索中' : '搜索'}</button>
                </div>
                <div className="city-search-content">
                    {showProgress && (
                        <div className="search-progress-box">
                            {SEARCH_STEPS.map(s => {
                                const st = stepStates[s.id];
                                return (
                                    <div key={s.id} className={`search-step search-step-${st}`}>
                                        <span className="search-step-icon">
                                            {st === 'done' ? <CheckCircleFilled /> : st === 'active' ? <LoadingOutlined /> : <span className="step-dot" />}
                                        </span>
                                        <span className="search-step-label">{s.label}</span>
                                        {stepDetails[s.id] ? <span className="search-step-detail">{stepDetails[s.id]}</span> : null}
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {!searched ? (
                        <div className="city-search-status">
                            <div className="sub-empty-icon"><SearchOutlined /></div>
                            <h3 style={{ fontSize: 18, fontWeight: 700, color: 'var(--text-primary)', marginBottom: 8 }}>搜索城市景点</h3>
                            <p style={{ fontSize: 14, color: 'var(--text-secondary)', lineHeight: 1.6 }}>输入城市名称，AI 将根据你的偏好推荐最适合的景点</p>
                        </div>
                    ) : !loading && attractions.length === 0 ? (
                        <div className="city-search-status">
                            <div className="sub-empty-icon"><EnvironmentOutlined /></div>
                            <h3 style={{ fontSize: 18, fontWeight: 700, color: 'var(--text-primary)', marginBottom: 8 }}>未找到景点</h3>
                            <p style={{ fontSize: 14, color: 'var(--text-secondary)' }}>请尝试其他城市名称</p>
                        </div>
                    ) : (
                        <>
                            {attractions.length > 0 && (
                                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 14 }}>
                                    已找到 {attractions.length} 个景点 · 已根据偏好排序
                                </div>
                            )}
                            {attractions.map((a, i) => (
                                <div key={i} className="attraction-card" onClick={e => navigate(e, a)}>
                                    <div className="attraction-card-header">
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <span className="attraction-name">{a.name}</span>
                                            {a.rating && <span className="attraction-rating">⭐ {a.rating}</span>}
                                            {a.confidence !== undefined && <span className="attraction-confidence">匹配度 {Math.round(Number(a.confidence) * 100)}%</span>}
                                        </div>
                                        <div className="attraction-actions">
                                            <button
                                                className={`attraction-action-btn${favorites.has(a.name) ? ' favorited' : ''}`}
                                                onClick={e => toggleFavorite(e, a)}
                                                aria-label="收藏">
                                                <StarFilled />
                                            </button>
                                            <button className="attraction-action-btn nav-btn" onClick={e => navigate(e, a)} aria-label="导航">
                                                <CompassOutlined />
                                            </button>
                                            <div className="attraction-feedback-menu">
                                                <button className="attraction-action-btn" onClick={e => { e.stopPropagation(); setFeedbackMenu(feedbackMenu === a.name ? null : a.name); }} aria-label="更多">
                                                    <EllipsisOutlined />
                                                </button>
                                                {feedbackMenu === a.name && (
                                                    <div className="feedback-popover" onClick={e => e.stopPropagation()}>
                                                        <button className="feedback-option like" onClick={e => submitFeedback(e, a, 'like')}><LikeOutlined />点赞{feedbacks[a.name] === 'like' ? ' ✓' : ''}</button>
                                                        <button className="feedback-option dislike" onClick={e => submitFeedback(e, a, 'dislike')}><DislikeOutlined />踩{feedbacks[a.name] === 'dislike' ? ' ✓' : ''}</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    {a.description && <div className="attraction-desc">{a.description}</div>}
                                    {a.address && <div className="attraction-addr"><EnvironmentOutlined style={{marginRight:4,fontSize:11}}/>{a.address}</div>}
                                    {a.tags && a.tags.length > 0 && (
                                        <div className="attraction-tags">
                                            {a.tags.slice(0, 4).map((t, j) => <span key={j} className="attraction-tag">{t}</span>)}
                                        </div>
                                    )}
                                </div>
                            ))}
                            <div ref={loadMoreRef} style={{ height: 1 }} />
                            {loadingMore && (
                                <div style={{ textAlign: 'center', padding: '20px 0', color: 'var(--text-muted)', fontSize: 13 }}>
                                    <LoadingOutlined style={{ marginRight: 8 }} />加载更多景点...
                                </div>
                            )}
                            {!loading && !loadingMore && !hasMore && attractions.length > 0 && (
                                <div style={{ textAlign: 'center', padding: '20px 0', color: 'var(--text-muted)', fontSize: 12 }}>已显示全部景点</div>
                            )}
                        </>
                    )}
                </div>
            </div>
        );
    }

    // ==================== App Shell (logged in) ====================
    function AppShell({ user, onLogout }) {
        const [activeTab, setActiveTab] = useState('home');
        const [showPrefs, setShowPrefs] = useState(false);
        const [subPage, setSubPage] = useState(null);
        const [headerSearch, setHeaderSearch] = useState('');
        const [citySearchQuery, setCitySearchQuery] = useState('');
        const [userLocation, setUserLocation] = useState(null);
        const [newProvince, setNewProvince] = useState(null);
        const footprintRecorded = useRef(false);

        useEffect(() => {
            if (user && user.has_preferences === false) {
                Modal.confirm({
                    title: '设置旅游偏好',
                    icon: <InfoCircleFilled />,
                    content: '你还没有设置旅游偏好，设置后 AI 将为你提供更精准的旅行推荐。是否现在去设置？',
                    okText: '去设置',
                    cancelText: '稍后再说',
                    onOk: () => setShowPrefs(true),
                    centered: true,
                });
            }
        }, [user]);

        // Record footprint on login
        useEffect(() => {
            if (!user || footprintRecorded.current) return;
            footprintRecorded.current = true;
            (async () => {
                try {
                    const locRes = await fetch('/api/ip_location.php');
                    const locData = await locRes.json();
                    if (!locData.success || !locData.province) return;
                    const fpRes = await fetch('/api/footprint.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            city: locData.city || '',
                            province: locData.province || '',
                            country: locData.country || '',
                            ip: locData.ip || '',
                            lng: locData.lng || null,
                            lat: locData.lat || null,
                        }),
                    });
                    const fpData = await fpRes.json();
                    if (fpData.success && fpData.is_new_province && fpData.province) {
                        setNewProvince(fpData.province);
                    }
                } catch { /* silent */ }
            })();
        }, [user]);

        // Congratulations modal for new province
        useEffect(() => {
            if (!newProvince) return;
            Modal.success({
                title: '恭喜解锁新地区',
                content: '你的足迹已到达「' + newProvince + '」！继续探索更多未知的地方吧。',
                centered: true,
                okText: '知道了',
                onOk: () => setNewProvince(null),
            });
            const timer = setTimeout(() => setNewProvince(null), 10000);
            return () => clearTimeout(timer);
        }, [newProvince]);

        if (showPrefs) return <PreferencePage user={user} onBack={() => setShowPrefs(false)} />;
        if (subPage === 'favorites') return <FavoritesPage onBack={() => setSubPage(null)} />;
        if (subPage === 'dislikes') return <DislikesPage onBack={() => setSubPage(null)} />;
        if (subPage === 'account') return <AccountSettingsPage user={user} onBack={() => setSubPage(null)} />;
        if (subPage === 'help') return <HelpPage onBack={() => setSubPage(null)} />;
        if (subPage === 'citySearch') return <CitySearchPage initialCity={citySearchQuery} onBack={() => { setSubPage(null); setCitySearchQuery(''); }} />;
        if (subPage === 'footprints') return <FootprintsPage user={user} onBack={() => setSubPage(null)} />;

        function handleHeaderSearchKey(e) {
            if (e.key === 'Enter' && headerSearch.trim()) {
                setCitySearchQuery(headerSearch.trim());
                setHeaderSearch('');
                setSubPage('citySearch');
            }
        }

        return (
            <div className="app-shell">
                {activeTab !== 'ai' && (
                <div className="app-header">
                    <div className="app-header-brand">
                        <div className="app-header-logo">
                            <img src="/img/logo.jpg" alt="UMap" />
                        </div>
                        <span className="app-header-title">UMap</span>
                    </div>
                    <div className="header-search-wrap">
                        <SearchOutlined className="header-search-icon" />
                        <input
                            className="header-search-input"
                            placeholder="搜索城市..."
                            value={headerSearch}
                            onChange={e => setHeaderSearch(e.target.value)}
                            onKeyDown={handleHeaderSearchKey}
                        />
                    </div>
                    <div className="app-header-user" onClick={() => setActiveTab('profile')}>
                        <Avatar size={30} style={{ background: 'linear-gradient(135deg, #6CB3FF 0%, #5EEADB 100%)', fontWeight: 700, fontSize: 12 }}>
                            {user.username[0].toUpperCase()}
                        </Avatar>
                        <span style={{ color: 'var(--text-secondary)', fontWeight: 500, fontSize: 13 }}>{user.username}</span>
                    </div>
                </div>
                )}

                <div className="app-content">
                    <div style={{display: activeTab === 'home' ? 'block' : 'none'}}><HomeTab user={user} onGoPrefs={() => setShowPrefs(true)} onNavigate={setSubPage} onLocationUpdate={setUserLocation} /></div>
                    <div style={{display: activeTab === 'ai' ? 'flex' : 'none'}}><AITab userLocation={userLocation} /></div>
                    <div style={{display: activeTab === 'profile' ? 'block' : 'none'}}><ProfileTab user={user} onLogout={onLogout} onGoPrefs={() => setShowPrefs(true)} onNavigate={setSubPage} /></div>
                </div>

                <div className="bottom-tab-bar">
                    <button className={`bottom-tab${activeTab === 'home' ? ' active' : ''}`} onClick={() => setActiveTab('home')}>
                        <span className="tab-icon"><HomeOutlined /></span>
                        <span className="tab-label">首页</span>
                    </button>
                    <button className={`bottom-tab${activeTab === 'ai' ? ' active' : ''}`} onClick={() => setActiveTab('ai')}>
                        <span className="tab-icon"><RobotOutlined /></span>
                        <span className="tab-label">AI</span>
                    </button>
                    <button className={`bottom-tab${activeTab === 'profile' ? ' active' : ''}`} onClick={() => setActiveTab('profile')}>
                        <span className="tab-icon"><UserOutlined /></span>
                        <span className="tab-label">我的</span>
                    </button>
                </div>
            </div>
        );
    }

    // ==================== Auth Page (with routing) ====================
    function MapLogo() {
        return <img src="/img/logo.jpg" alt="UMap Logo" />;
    }

    function AuthPage() {
        const [activeTab, setActiveTab] = useState('login');
        const [user, setUser] = useState(null);
        const [checking, setChecking] = useState(true);

        useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const verified = params.get('verified');
            if (verified === 'success') { message.success('邮箱验证成功，请登录！'); window.history.replaceState({}, '', '/'); }
            else if (verified === 'already') { message.info('邮箱已验证，请直接登录'); window.history.replaceState({}, '', '/'); }
            fetch('/api/user.php').then(r => r.json()).then(d => { if (d.success) setUser(d.user); }).finally(() => setChecking(false));
        }, []);

        if (checking) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#F5F7FA', fontFamily: 'var(--font-body)', fontSize: 16, color: TOKEN.primary }}>加载中...</div>;

        if (user) return <AppShell user={user} onLogout={() => setUser(null)} />;

        return (
            <div className="auth-page">
                <div className="auth-brand">
                    <div className="brand-content">
                        <div className="brand-logo"><MapLogo /></div>
                        <h1 className="brand-name">U<span>Map</span></h1>
                        <p className="brand-tagline">探索世界 · 精准导航 · 智能地理信息服务</p>
                        <div className="brand-features">
                            <div className="brand-feature"><span className="feature-dot"></span>实时地图浏览与路径规划</div>
                            <div className="brand-feature"><span className="feature-dot"></span>多图层地理数据可视化</div>
                            <div className="brand-feature"><span className="feature-dot"></span>智能搜索与兴趣点标注</div>
                        </div>
                    </div>
                </div>
                <div className="auth-form-area">
                    <div className="auth-card-wrapper">
                        <div className="auth-form-header">
                            <h2>{activeTab === 'login' ? '欢迎回来' : '创建账号'}</h2>
                            <p>{activeTab === 'login' ? '登录你的 UMap 账号继续探索' : '注册 UMap 开始你的地图之旅'}</p>
                        </div>
                        <div className="auth-tabs" role="tablist">
                            <button role="tab" aria-selected={activeTab === 'login'} className={`auth-tab${activeTab === 'login' ? ' active' : ''}`} onClick={() => setActiveTab('login')}>登录</button>
                            <button role="tab" aria-selected={activeTab === 'register'} className={`auth-tab${activeTab === 'register' ? ' active' : ''}`} onClick={() => setActiveTab('register')}>注册</button>
                        </div>
                        {activeTab === 'login' ? <LoginForm onLogin={setUser} /> : <RegisterForm onSuccess={() => setActiveTab('login')} />}
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthPage />);
</script>
</body>
</html>
