    <style>

        /* Bottom Tab Bar — Enterprise SaaS Mobile */

        .profile-menu-text { flex: 1; min-width: 0; }
        .profile-menu-text h4 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 1px; }
        .profile-menu-text p { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-menu-arrow { color: #CBD5E1; font-size: 12px; flex-shrink: 0; }
        .profile-logout { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(15,20,55,0.06); }
        .profile-version { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 20px; padding-bottom: 8px; }

        /* ===== Preference Page ===== */
        .pref-page { min-height: 100vh; background: #F5F7FA; }
        .pref-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 8px rgba(0,0,0,0.04); }
        .pref-header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .pref-layout { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; }
        .pref-sidebar { width: 260px; flex-shrink: 0; }
        .pref-main { flex: 1; min-width: 0; }
        .pref-sidebar-card { background: var(--surface); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-card); position: sticky; top: 100px; }
        .pref-sidebar-card h3 { font-family: var(--font-heading); font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .tier-option { display: block; width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; margin-bottom: 8px; transition: all var(--transition-base); font-family: var(--font-body); font-size: 14px; }
        .tier-option:hover { border-color: var(--primary); }
        .tier-option.active { border-color: var(--primary); background: #EEF4FF; box-shadow: 0 0 0 3px rgba(21,101,239,0.08); }
        .tier-option .tier-name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .tier-option .tier-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .pref-category { background: var(--surface); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .pref-category h4 { font-family: var(--font-heading); font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .pref-cat-badge { background: #EEF4FF; color: var(--primary); font-size: 12px; padding: 2px 10px; border-radius: 100px; font-weight: 500; }
        .pref-tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .pref-tag { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 100px; font-size: 13px; font-weight: 500; background: var(--surface); cursor: pointer; transition: all 150ms ease; color: var(--text-secondary); user-select: none; white-space: nowrap; font-family: var(--font-body); }
        .pref-tag:hover { border-color: var(--primary); color: var(--primary); background: #FAFBFF; }
        .pref-tag.selected { background: linear-gradient(135deg, var(--primary) 0%, #3363E0 100%); color: #FFF; border-color: transparent; box-shadow: 0 2px 10px rgba(21,101,239,0.25); transform: scale(1.02); }
        .pref-tag.selected .anticon { color: rgba(255,255,255,0.9); }
        .pref-tag.blocked { border-color: #FECDD3; background: #FFF5F5; color: #BE123C; cursor: not-allowed; opacity: 0.7; }
        .pref-tag.blocked:hover { border-color: #FECDD3; background: #FFF5F5; color: #BE123C; }
        .pref-custom-input { display: flex; gap: 8px; margin-top: 16px; }
        .pref-custom-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .custom-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #F0FDF9; border: 1px solid #A7F3D0; color: var(--accent); border-radius: 100px; font-size: 13px; font-weight: 500; }
        .custom-chip .remove-btn { cursor: pointer; color: var(--accent); opacity: 0.6; transition: opacity 150ms; }
        .custom-chip .remove-btn:hover { opacity: 1; }

        .conflict-toast { background: #FFF1F0; border: 1px solid #FFA39E; border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 16px; font-size: 13px; color: #CF1322; display: flex; align-items: center; gap: 8px; }

        @media (max-width: 900px) {
            .pref-layout { flex-direction: column; padding: 16px; }
            .pref-sidebar { width: 100%; }
            .pref-sidebar-card { position: static; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
            .pref-sidebar-card h3 { width: 100%; margin-bottom: 0; }
            .tier-option { flex: 1; min-width: 120px; margin-bottom: 0; text-align: center; }
        }
        @media (min-width: 769px) { .auth-brand { display: flex; } }
        @media (min-width: 769px) {
            .app-shell { max-width: 430px; margin: 0 auto; box-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 32px 80px rgba(0,0,0,0.55); }
            .bottom-tab-bar { left: 50%; transform: translateX(-50%); width: 430px; right: auto; }
        }
        @media (max-width: 768px) {
            .auth-page { flex-direction: column; }
            .auth-brand { display: flex; flex: none; padding: 32px 24px 40px; min-height: 240px; }
            .brand-logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 16px; padding: 7px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.15); }
            .brand-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
            .brand-name { font-size: 26px; }
            .brand-tagline { font-size: 14px; margin-bottom: 0; }
            .brand-features { display: none; }
            .auth-form-area { padding: 0 20px 40px; margin-top: -24px; }
            .auth-card-wrapper { background: var(--surface-glass); backdrop-filter: blur(12px); border-radius: var(--radius-lg); padding: 28px 24px; box-shadow: var(--shadow-elevated); margin-top: -32px; }
            .app-header { padding: 12px 16px; }
            .home-cards { grid-template-columns: 1fr 1fr; gap: 10px; }
            .home-content, .profile-content, .ai-content { padding: 16px; }
            .dashboard-header { padding: 14px 20px; }
            .pref-header { padding: 12px 16px; }
            .pref-tags { gap: 8px; }
            .pref-tag { padding: 6px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
</script>
<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const {
        Form, Input, Button, Card, message, Tabs, Typography, Space, Avatar, Dropdown, Layout,
        Result, Tooltip, Tag, Spin, Progress, Popconfirm
    } = antd;
    const AntInput = antd.Input;
    const {
        UserOutlined, LockOutlined, MailOutlined, EnvironmentOutlined, LogoutOutlined,
        CheckCircleFilled, SafetyOutlined, HeartFilled, TagsOutlined, PlusOutlined,
        CloseOutlined, ArrowLeftOutlined, SaveOutlined, InfoCircleFilled, WarningFilled,
        LoadingOutlined, StarFilled, DeleteOutlined, HomeOutlined, RobotOutlined,
        RightOutlined, SettingOutlined, BellOutlined, QuestionCircleOutlined, AimOutlined
    } = icons;

    const RECAPTCHA_SITE_KEY = '6LeBLvcsAAAAAANaL5q8z4tVmVu1QPbrzarCBeoi';
    const TOKEN = { primary: '#1565EF', accent: '#0D9488', bgStart: '#0F1E3D', bgMid: '#15305A', bgEnd: '#0A1628' };
    const TIER_CONFIG = {
        quick: { label: '初步筛选', tags: 25, min: 10, desc: '适合快速体验 (25个标签, 至少选10个)' },
        medium: { label: '中度测评', tags: 50, min: 20, desc: '中度的偏好测评 (50个标签, 至少选20个)' },
        full: { label: '完整测试', tags: 100, min: 30, desc: '完整细致的偏好 (100个标签, 至少选30个)' },
    };

    // ==================== Recaptcha Widget ====================
    function RecaptchaWidget({ onVerify, resetKey }) {
        const containerRef = useRef(null);
        const widgetIdRef = useRef(null);
        useEffect(() => {
            const tryRender = () => {
                if (!window.grecaptcha?.render || !containerRef.current) return false;
                try { widgetIdRef.current = window.grecaptcha.render(containerRef.current, { sitekey: RECAPTCHA_SITE_KEY, callback: onVerify, theme: 'light' }); return true; }
                catch(e) { return false; }
            };
            if (!tryRender()) { const t = setInterval(() => { if (tryRender()) clearInterval(t); }, 200); return () => clearInterval(t); }
        }, []);
        useEffect(() => { if (resetKey > 0 && widgetIdRef.current !== null && window.grecaptcha) { try { window.grecaptcha.reset(widgetIdRef.current); } catch(e) {} } }, [resetKey]);
        return <div ref={containerRef} className="g-recaptcha-container"></div>;
    }

    // ==================== Auth Hook ====================
    function useAuthForm() {
        const [loading, setLoading] = useState(false);
        const [captchaToken, setCaptchaToken] = useState('');
        const [captchaReset, setCaptchaReset] = useState(0);
        const resetCaptcha = () => { setCaptchaToken(''); setCaptchaReset(k => k + 1); };
        async function submit(url, body) {
            if (!captchaToken) { message.warning('请完成人机验证'); return null; }
            setLoading(true);
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, recaptcha_token: captchaToken }) });
                const data = await res.json();
                if (data.success) { message.success(data.message); return data; }
                message.error(data.message); resetCaptcha(); return null;
            } catch(e) { message.error('网络错误，请稍后重试'); resetCaptcha(); return null; }
            finally { setLoading(false); }
        }
        return { loading, captchaToken, setCaptchaToken, captchaReset, resetCaptcha, submit };
    }

    // ==================== Login Form ====================
    function LoginForm({ onLogin }) {
        const [form] = Form.useForm();
        const { loading, captchaToken, setCaptchaToken, captchaReset, submit } = useAuthForm();
        async function handleSubmit(v) { const d = await submit('/api/login.php', { account: v.account, password: v.password }); if (d?.user) onLogin(d.user); }
        return (
            <Form form={form} onFinish={handleSubmit} size="large" layout="vertical">
                <Form.Item name="account" rules={[{ required: true, message: '请输入用户名或邮箱' }]}>
                    <Input prefix={<UserOutlined style={{ color: TOKEN.accent }} />} placeholder="用户名或邮箱" autoComplete="username" />
                </Form.Item>
                <Form.Item name="password" rules={[{ required: true, message: '请输入密码' }]}>
                    <Input.Password prefix={<LockOutlined style={{ color: TOKEN.accent }} />} placeholder="密码" autoComplete="current-password" />
                </Form.Item>
                <Form.Item><RecaptchaWidget onVerify={setCaptchaToken} resetKey={captchaReset} /></Form.Item>
                <Form.Item><Button type="primary" htmlType="submit" block loading={loading}>登录</Button></Form.Item>
            </Form>
        );
    }

    // ==================== Register Form ====================
    function RegisterForm({ onSuccess }) {
        const [form] = Form.useForm();
        const { loading, captchaToken, setCaptchaToken, captchaReset, submit } = useAuthForm();
        async function handleSubmit(v) {
            const d = await submit('/api/register.php', { username: v.username, email: v.email, password: v.password });
            if (d?.success) { form.resetFields(); onSuccess(); }
        }
        return (
            <Form form={form} onFinish={handleSubmit} size="large" layout="vertical">
                <Form.Item name="username" rules={[{ required: true, message: '请输入用户名' }, { min: 3, max: 50, message: '用户名长度 3-50 个字符' }, { pattern: /^[a-zA-Z0-9_一-龥]+$/, message: '仅支持字母、数字、下划线和中文' }]}>
                    <Input prefix={<UserOutlined style={{ color: TOKEN.accent }} />} placeholder="用户名" autoComplete="username" />
                </Form.Item>
                <Form.Item name="email" rules={[{ required: true, message: '请输入邮箱' }, { type: 'email', message: '请输入有效的邮箱地址' }]}>
                    <Input prefix={<MailOutlined style={{ color: TOKEN.accent }} />} placeholder="电子邮箱" autoComplete="email" />
                </Form.Item>
                <Form.Item name="password" rules={[{ required: true, message: '请输入密码' }, { min: 8, message: '密码长度至少 8 个字符' }]}>
                    <Input.Password prefix={<LockOutlined style={{ color: TOKEN.accent }} />} placeholder="密码（至少8位）" autoComplete="new-password" />
                </Form.Item>
                <Form.Item name="confirmPassword" dependencies={['password']} rules={[{ required: true, message: '请确认密码' }, ({ getFieldValue }) => ({ validator(_, value) { if (!value || getFieldValue('password') === value) return Promise.resolve(); return Promise.reject(new Error('两次密码不一致')); } })]}>
                    <Input.Password prefix={<LockOutlined style={{ color: TOKEN.accent }} />} placeholder="确认密码" autoComplete="new-password" />
                </Form.Item>
                <Form.Item><RecaptchaWidget onVerify={setCaptchaToken} resetKey={captchaReset} /></Form.Item>
                <Form.Item><Button type="primary" htmlType="submit" block loading={loading}>注册</Button></Form.Item>
            </Form>
        );
    }

    // ==================== Preference Page ====================
    function PreferencePage({ user, onBack }) {
        const [tier, setTier] = useState('quick');
        const [categories, setCategories] = useState({});
        const [customTags, setCustomTags] = useState([]);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [customInput, setCustomInput] = useState('');
        const [conflict, setConflict] = useState(null);
        const tagMapRef = useRef({}); // id => tag object

        const config = TIER_CONFIG[tier];

        // Fetch tags for current tier
        const fetchTags = useCallback(async (t) => {
            setLoading(true); setConflict(null);
            try {
                const res = await fetch(`/api/preferences/tags.php?tier=${t}`);
                const data = await res.json();
                if (data.success) {
                    setCategories(data.categories || {});
                    setSelectedIds(new Set(data.selected_ids || []));
                    setCustomTags(data.custom_tags || []);
                    // Build tag map for quick lookup
                    const map = {};
                    Object.values(data.categories || {}).forEach(tags => {
                        tags.forEach(tag => { map[tag.id] = tag; });
                    });
                    tagMapRef.current = map;
                }
            } catch(e) { message.error('加载标签失败'); }
            finally { setLoading(false); }
        }, []);

        useEffect(() => { fetchTags(tier); }, [tier]);

        // Toggle tag selection with conflict detection
        function toggleTag(tag) {
            const tagId = tag.id;
            const oppositeId = tag.opposite_id;

            setConflict(null);

            if (selectedIds.has(tagId)) {
                // Deselect
                const next = new Set(selectedIds);
                next.delete(tagId);
                setSelectedIds(next);
            } else {
                // Check if opposite is selected
                if (oppositeId && selectedIds.has(oppositeId)) {
                    const opp = tagMapRef.current[oppositeId];
                    setConflict({
                        tagName: tag.name,
                        oppositeName: opp?.name || '对立标签',
                        tagId, oppositeId,
                    });
                    return; // Block selection
                }
                const next = new Set(selectedIds);
                next.add(tagId);
                setSelectedIds(next);
            }
        }

        // Resolve conflict: deselect opposite and select current
        function resolveConflict(chooseCurrent) {
            if (!conflict) return;
            const next = new Set(selectedIds);
            if (chooseCurrent) {
                next.delete(conflict.oppositeId);
                next.add(conflict.tagId);
            } else {
                next.delete(conflict.tagId);
            }
            setSelectedIds(next);
            setConflict(null);
        }

        // Save preferences
        async function handleSave() {
            const count = selectedIds.size;
            if (count < config.min) {
                message.warning(`至少需要选择 ${config.min} 个标签，当前已选 ${count} 个`);
                return;
            }
            setSaving(true);
            try {
                const res = await fetch('/api/preferences/save.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag_ids: [...selectedIds], tier }),
                });
                const data = await res.json();
                if (data.success) { message.success(data.message); onBack(); }
                else { message.error(data.message); }
            } catch(e) { message.error('保存失败'); }
            finally { setSaving(false); }
        }

        // Add custom tag
        async function addCustomTag() {
            const name = customInput.trim();
            if (!name || name.length > 50) return;
            try {
                const res = await fetch('/api/preferences/custom-tag.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name }),
                });
                const data = await res.json();
                if (data.success) {
                    setCustomTags(prev => [...prev, data.tag]);
                    setCustomInput('');
                    message.success('自定义标签已添加');
                } else { message.error(data.message); }
            } catch(e) { message.error('添加失败'); }
        }

        async function removeCustomTag(tag) {
            try {
                await fetch('/api/preferences/custom-tag.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: tag.id }),
                });
                setCustomTags(prev => prev.filter(t => t.id !== tag.id));
            } catch(e) { message.error('删除失败'); }
        }

        // Calculate progress
        const count = selectedIds.size;
        const percent = Math.min(Math.round((count / config.min) * 100), 100);
        const isComplete = count >= config.min;

        // Get ALL category tags (not just selected) for display
        const categoryEntries = Object.entries(categories);

        return (
            <div className="pref-page">
                <div className="pref-header">
                    <div className="pref-header-inner">
                        <Space>
                            <Button type="text" icon={<ArrowLeftOutlined />} onClick={onBack} />
                            <span style={{ fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: 18 }}>旅游偏好选择</span>
                        </Space>
                        <Space>
                            <Tag color={isComplete ? 'success' : 'processing'}>{isComplete ? '已达标' : `还需${config.min - count}个`}</Tag>
                            <Button type="primary" icon={<SaveOutlined />} onClick={handleSave} loading={saving} size="large"
                                disabled={!isComplete}
                                style={{ borderRadius: 10, fontWeight: 600 }}>
                                保存偏好 ({count}/{config.min})
                            </Button>
                        </Space>
                    </div>
                </div>

                <div className="pref-layout">
                    {/* Sidebar */}
                    <div className="pref-sidebar">
                        <div className="pref-sidebar-card">
                            <h3>筛选层级</h3>
                            {Object.entries(TIER_CONFIG).map(([key, cfg]) => (
                                <button key={key}
                                    className={`tier-option${tier === key ? ' active' : ''}`}
                                    onClick={() => setTier(key)}>
                                    <div className="tier-name">{cfg.label}</div>
                                    <div className="tier-desc">{cfg.desc}</div>
                                </button>
                            ))}
                            <div style={{ marginTop: 20 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontSize: 13, color: 'var(--text-secondary)' }}>
                                    <span>完成度</span>
                                    <span>{count} / {config.min}+</span>
                                </div>
                                <Progress percent={percent} status={isComplete ? 'success' : 'active'}
                                    strokeColor={{ from: '#1565EF', to: '#0D9488' }} />
                            </div>
                            <div style={{ marginTop: 20 }}>
                                <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 8 }}>自定义标签</div>
                                <div style={{ display: 'flex', gap: 6 }}>
                                    <AntInput size="small" value={customInput} onChange={e => setCustomInput(e.target.value)}
                                        placeholder="输入自定义标签" style={{ borderRadius: 8 }}
                                        onPressEnter={addCustomTag} />
                                    <Button size="small" icon={<PlusOutlined />} onClick={addCustomTag}
                                        style={{ borderRadius: 8 }} />
                                </div>
                                <div className="pref-custom-chips">
                                    {customTags.map(t => (
                                        <span key={t.id} className="custom-chip">
                                            {t.name}
                                            <span className="remove-btn" onClick={() => removeCustomTag(t)}>×</span>
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Tag Area */}
                    <div className="pref-main">
                        {loading ? (
                            <div style={{ textAlign: 'center', padding: 80, background: '#FFF', borderRadius: 16 }}>
                                <Spin size="large" /><div style={{ marginTop: 16, color: 'var(--text-secondary)' }}>加载偏好标签...</div>
                            </div>
                        ) : (
                            <>
                                {conflict && (
                                    <div className="conflict-toast">
                                        <WarningFilled style={{ fontSize: 16 }} />
                                        <span>「{conflict.tagName}」与「{conflict.oppositeName}」互斥，只能选择其中一个。</span>
                                        <Button size="small" type="primary" danger onClick={() => resolveConflict(true)}
                                            style={{ marginLeft: 8, borderRadius: 6 }}>选当前</Button>
                                        <Button size="small" onClick={() => resolveConflict(false)}
                                            style={{ marginLeft: 4, borderRadius: 6 }}>保留原来的</Button>
                                    </div>
                                )}

                                {categoryEntries.map(([catName, tags]) => {
                                    const selInCat = tags.filter(t => selectedIds.has(t.id)).length;
                                    return (
                                        <div key={catName} className="pref-category">
                                            <h4>
                                                {catName}
                                                <span className="pref-cat-badge">{selInCat}/{tags.length}</span>
                                            </h4>
                                            <div className="pref-tags">
                                                {tags.map(tag => {
                                                    const isSelected = selectedIds.has(tag.id);
                                                    const isOppositeSel = tag.opposite_id && selectedIds.has(tag.opposite_id);
                                                    const isBlocked = !isSelected && isOppositeSel;
                                                    let cls = 'pref-tag';
                                                    if (isSelected) cls += ' selected';
                                                    else if (isBlocked) cls += ' blocked';

                                                    return (
                                                        <span key={tag.id}
                                                            className={cls}
                                                            onClick={() => !isBlocked && toggleTag(tag)}
                                                            title={isBlocked ? `与「${tagMapRef.current[tag.opposite_id]?.name || '对立标签'}」互斥` : ''}>
                                                            {isSelected && <CheckCircleFilled style={{ marginRight: 4 }} />}
                                                            {isBlocked && <WarningFilled style={{ marginRight: 4 }} />}
                                                            {tag.name}
                                                        </span>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}

                                {/* Save button at bottom */}
                                <div style={{ textAlign: 'center', padding: '24px 0 48px' }}>
                                    <Button type="primary" size="large" icon={<SaveOutlined />}
                                        onClick={handleSave} loading={saving}
                                        disabled={!isComplete}
                                        style={{ height: 52, padding: '0 48px', borderRadius: 12, fontSize: 16, fontWeight: 600 }}>
                                        保存偏好 ({count}/{config.min}+)
                                    </Button>
                                    {!isComplete && (
                                        <div style={{ marginTop: 12, color: 'var(--text-muted)', fontSize: 13 }}>
                                            请至少选择 {config.min} 个标签后保存
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    // ==================== Home Tab ====================
    function HomeTab({ user, onGoPrefs }) {
        const mapContainerRef = useRef(null);
        const mapRef = useRef(null);
        const AMapRef = useRef(null);
        const markerRef = useRef(null);
        const [locStatus, setLocStatus] = useState('loading');
        const [locLabel, setLocLabel] = useState('定位中...');
        const [refreshing, setRefreshing] = useState(false);

        function locateUser(AMap, map) {
            setLocStatus('loading');
            setLocLabel('定位中...');
            setRefreshing(true);
            if (markerRef.current) { map.remove(markerRef.current); markerRef.current = null; }

            const geo = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 8000, zoomToAccuracy: false });
            geo.getCurrentPosition((status, result) => {
                if (status === 'complete') {
                    const { lng, lat } = result.position;
                    map.setCenter([lng, lat]);
                    map.setZoom(15);
                    const marker = new AMap.Marker({
                        position: [lng, lat],
                        content: '<div style="width:18px;height:18px;border-radius:50%;background:#1565EF;border:3px solid #fff;box-shadow:0 0 0 5px rgba(21,101,239,0.22),0 2px 8px rgba(0,0,0,0.2)"></div>',
                        offset: new AMap.Pixel(-9, -9),
                        zIndex: 200,
                    });
                    map.add(marker);
                    markerRef.current = marker;
                    setLocStatus('gps');
                    setLocLabel('GPS 定位');
                    setRefreshing(false);
                } else {
                    new AMap.CitySearch().getLocalCity((s2, r2) => {
                        if (s2 === 'complete' && r2.bounds) {
                            map.setBounds(r2.bounds);
                            setLocStatus('ip');
                            setLocLabel(r2.city || 'IP 定位');
                        } else {
                            setLocStatus('failed');
                            setLocLabel('定位失败');
                        }
                        setRefreshing(false);
                    });
                }
            });
        }

        useEffect(() => {
            if (!window.AMapLoader) { setLocStatus('failed'); setLocLabel('地图未加载'); return; }
            let destroyed = false;

            window.AMapLoader.load({
                key: 'AMAP_KEY_REMOVED',
                version: '2.0',
                plugins: ['AMap.Geolocation', 'AMap.CitySearch'],
            }).then(AMap => {
                if (destroyed) return;
                AMap.getConfig().appname = 'amap-jsapi-skill';
                AMapRef.current = AMap;
                const map = new AMap.Map(mapContainerRef.current, { zoom: 13, mapStyle: 'amap://styles/normal' });
                mapRef.current = map;
                locateUser(AMap, map);
            }).catch(() => { setLocStatus('failed'); setLocLabel('地图加载失败'); setRefreshing(false); });

            return () => {
                destroyed = true;
                if (mapRef.current) { mapRef.current.destroy(); mapRef.current = null; }
            };
        }, []);

        function handleRefresh() {
            if (!AMapRef.current || !mapRef.current || refreshing) return;
            locateUser(AMapRef.current, mapRef.current);
        }

        const statusIcon = locStatus === 'loading' ? <LoadingOutlined /> : <EnvironmentOutlined />;

        return (
            <div className="home-map-page">
                <div className="home-map-container">
                    <div ref={mapContainerRef} className="home-map"></div>
                    <div className={`home-map-status ${locStatus}`}>{statusIcon}{locLabel}</div>
                    <button className={`home-map-refresh${refreshing ? ' spinning' : ''}`} onClick={handleRefresh} aria-label="重新定位">
                        <AimOutlined />
                    </button>
                </div>
                <div className="home-scroll-area">
                    <div className="home-hero">
                        <div className="home-hero-content">
                            <div className="home-hero-greeting">欢迎回来</div>
                            <h2><span className="home-hero-username">{user.username}</span> 👋</h2>
                            <p>探索世界，发现属于你的地图故事</p>
                        </div>
                    </div>
                    <div className="home-stats">
                        <div className="home-stat">
                            <div className="home-stat-num">0</div>
                            <div className="home-stat-label">收藏地点</div>
                        </div>
                        <div className="home-stat">
                            <div className="home-stat-num">0</div>
                            <div className="home-stat-label">规划路线</div>
                        </div>
                        <div className="home-stat">
                            <div className="home-stat-num">0</div>
                            <div className="home-stat-label">探索足迹</div>
                        </div>
                    </div>
                    <div className="home-section-title">快捷功能</div>
                    <div className="home-cards">
                        <div className="home-card" onClick={onGoPrefs}>
                            <div className="home-card-icon" style={{ background: '#EEF4FF' }}>
                                <HeartFilled style={{ color: 'var(--primary)' }} />
                            </div>
                            <h4>旅游偏好</h4>
                            <p>设置你的旅行风格与兴趣标签</p>
                        </div>
                        <div className="home-card">
                            <div className="home-card-icon" style={{ background: '#F0FDF9' }}>
                                <StarFilled style={{ color: 'var(--accent)' }} />
                            </div>
                            <h4>收藏地点</h4>
                            <p>查看你保存的地图收藏</p>
                        </div>
                        <div className="home-card">
                            <div className="home-card-icon" style={{ background: '#FFF7ED' }}>
                                <TagsOutlined style={{ color: '#F97316' }} />
                            </div>
                            <h4>路线规划</h4>
                            <p>智能生成个性化旅行路线</p>
                        </div>
                        <div className="home-card">
                            <div className="home-card-icon" style={{ background: '#FDF4FF' }}>
                                <EnvironmentOutlined style={{ color: '#A855F7' }} />
                            </div>
                            <h4>附近发现</h4>
                            <p>探索周边热门地点与活动</p>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== AI Tab ====================
    function AITab() {
        return (
            <div className="ai-content">
                <div className="ai-placeholder">
                    <div className="ai-glow-ring">
                        <RobotOutlined style={{ color: 'var(--primary)', fontSize: 40 }} />
                    </div>
                    <span className="ai-badge">即将上线</span>
                    <h3>AI 智能助手</h3>
                    <p>基于你的旅游偏好，AI 将为你提供个性化的目的地推荐、行程规划和旅行建议。</p>
                    <div className="ai-features">
                        <div className="ai-feature-item">
                            <div className="ai-feature-dot" style={{ background: 'var(--primary)' }}></div>
                            <span className="ai-feature-text">智能目的地推荐</span>
                        </div>
                        <div className="ai-feature-item">
                            <div className="ai-feature-dot" style={{ background: 'var(--accent)' }}></div>
                            <span className="ai-feature-text">个性化行程规划</span>
                        </div>
                        <div className="ai-feature-item">
                            <div className="ai-feature-dot" style={{ background: '#F97316' }}></div>
                            <span className="ai-feature-text">实时旅行建议</span>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== Profile Tab ====================
    function ProfileTab({ user, onLogout, onGoPrefs }) {
        async function handleLogout() { await fetch('/api/logout.php'); onLogout(); }
        return (
            <div className="profile-content">
                <div className="profile-hero">
                    <div className="profile-avatar">{user.username[0].toUpperCase()}</div>
                    <div className="profile-name">{user.username}</div>
                    <div className="profile-email">{user.email}</div>
                    <div className="profile-verified">
                        <CheckCircleFilled style={{ fontSize: 10 }} />
                        已验证账号
                    </div>
                </div>
                <div className="profile-section-title">功能设置</div>
                <div className="profile-menu">
                    <div className="profile-menu-item" onClick={onGoPrefs}>
                        <div className="profile-menu-icon" style={{ background: '#EEF4FF' }}>
                            <HeartFilled style={{ color: 'var(--primary)', fontSize: 18 }} />
                        </div>
                        <div className="profile-menu-text">
                            <h4>旅游偏好设置</h4>
                            <p>管理你的旅行风格与兴趣标签</p>
                        </div>
                        <RightOutlined className="profile-menu-arrow" />
                    </div>
                    <div className="profile-menu-item">
                        <div className="profile-menu-icon" style={{ background: '#F0FDF9' }}>
                            <BellOutlined style={{ color: 'var(--accent)', fontSize: 18 }} />
                        </div>
                        <div className="profile-menu-text">
                            <h4>消息通知</h4>
                            <p>管理推送与提醒设置</p>
                        </div>
                        <RightOutlined className="profile-menu-arrow" />
                    </div>
                    <div className="profile-menu-item">
                        <div className="profile-menu-icon" style={{ background: '#FFF7ED' }}>
                            <SettingOutlined style={{ color: '#F97316', fontSize: 18 }} />
                        </div>
                        <div className="profile-menu-text">
                            <h4>账号设置</h4>
                            <p>修改密码与账号信息</p>
                        </div>
                        <RightOutlined className="profile-menu-arrow" />
                    </div>
                    <div className="profile-menu-item">
                        <div className="profile-menu-icon" style={{ background: '#F5F5F5' }}>
                            <QuestionCircleOutlined style={{ color: '#8C93A3', fontSize: 18 }} />
                        </div>
                        <div className="profile-menu-text">
                            <h4>帮助与反馈</h4>
                            <p>常见问题与意见反馈</p>
                        </div>
                        <RightOutlined className="profile-menu-arrow" />
                    </div>
                </div>
                <div className="profile-section-title">账号操作</div>
                <div className="profile-logout">
                    <div className="profile-menu-item" onClick={handleLogout}>
                        <div className="profile-menu-icon" style={{ background: '#FFF1F0' }}>
                            <LogoutOutlined style={{ color: '#DE345D', fontSize: 18 }} />
                        </div>
                        <div className="profile-menu-text">
                            <h4 style={{ color: '#DE345D' }}>退出登录</h4>
                        </div>
                    </div>
                </div>
                <div className="profile-version">UMap v1.0.0 · 探索世界</div>
            </div>
        );
    }

    // ==================== App Shell (logged in) ====================
    function AppShell({ user, onLogout }) {
        const [activeTab, setActiveTab] = useState('home');
        const [showPrefs, setShowPrefs] = useState(false);

        if (showPrefs) return <PreferencePage user={user} onBack={() => setShowPrefs(false)} />;

        return (
            <div className="app-shell">
                <div className="app-header">
                    <div className="app-header-brand">
                        <div className="app-header-logo">
                            <img src="/img/logo.jpg" alt="UMap" />
                        </div>
                        <span className="app-header-title">UMap</span>
                    </div>
                    <div className="app-header-user" onClick={() => setActiveTab('profile')}>
                        <Avatar size={30} style={{ background: 'linear-gradient(135deg, #6CB3FF 0%, #5EEADB 100%)', fontWeight: 700, fontSize: 12 }}>
                            {user.username[0].toUpperCase()}
                        </Avatar>
                        <span style={{ color: 'var(--text-secondary)', fontWeight: 500, fontSize: 13 }}>{user.username}</span>
                    </div>
                </div>

                <div className="app-content">
                    {activeTab === 'home' && <HomeTab user={user} onGoPrefs={() => setShowPrefs(true)} />}
                    {activeTab === 'ai' && <AITab />}
                    {activeTab === 'profile' && <ProfileTab user={user} onLogout={onLogout} onGoPrefs={() => setShowPrefs(true)} />}
                </div>

                <div className="bottom-tab-bar">
                    <button className={`bottom-tab${activeTab === 'home' ? ' active' : ''}`} onClick={() => setActiveTab('home')}>
                        <span className="tab-icon"><HomeOutlined /></span>
                        <span className="tab-label">首页</span>
                    </button>
                    <button className={`bottom-tab${activeTab === 'ai' ? ' active' : ''}`} onClick={() => setActiveTab('ai')}>
                        <span className="tab-icon"><RobotOutlined /></span>
                        <span className="tab-label">AI</span>
                    </button>
                    <button className={`bottom-tab${activeTab === 'profile' ? ' active' : ''}`} onClick={() => setActiveTab('profile')}>
                        <span className="tab-icon"><UserOutlined /></span>
                        <span className="tab-label">我的</span>
                    </button>
                </div>
            </div>
        );
    }

    // ==================== Auth Page (with routing) ====================
    function MapLogo() {
        return <img src="/img/logo.jpg" alt="UMap Logo" />;
    }

    function AuthPage() {
        const [activeTab, setActiveTab] = useState('login');
        const [user, setUser] = useState(null);
        const [checking, setChecking] = useState(true);

        useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const verified = params.get('verified');
            if (verified === 'success') { message.success('邮箱验证成功，请登录！'); window.history.replaceState({}, '', '/'); }
            else if (verified === 'already') { message.info('邮箱已验证，请直接登录'); window.history.replaceState({}, '', '/'); }
            fetch('/api/user.php').then(r => r.json()).then(d => { if (d.success) setUser(d.user); }).finally(() => setChecking(false));
        }, []);

        if (checking) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#F5F7FA', fontFamily: 'var(--font-body)', fontSize: 16, color: TOKEN.primary }}>加载中...</div>;

        if (user) return <AppShell user={user} onLogout={() => setUser(null)} />;

        return (
            <div className="auth-page">
                <div className="auth-brand">
                    <div className="brand-content">
                        <div className="brand-logo"><MapLogo /></div>
                        <h1 className="brand-name">U<span>Map</span></h1>
                        <p className="brand-tagline">探索世界 · 精准导航 · 智能地理信息服务</p>
                        <div className="brand-features">
                            <div className="brand-feature"><span className="feature-dot"></span>实时地图浏览与路径规划</div>
                            <div className="brand-feature"><span className="feature-dot"></span>多图层地理数据可视化</div>
                            <div className="brand-feature"><span className="feature-dot"></span>智能搜索与兴趣点标注</div>
                        </div>
                    </div>
                </div>
                <div className="auth-form-area">
                    <div className="auth-card-wrapper">
                        <div className="auth-form-header">
                            <h2>{activeTab === 'login' ? '欢迎回来' : '创建账号'}</h2>
                            <p>{activeTab === 'login' ? '登录你的 UMap 账号继续探索' : '注册 UMap 开始你的地图之旅'}</p>
                        </div>
                        <div className="auth-tabs" role="tablist">
                            <button role="tab" aria-selected={activeTab === 'login'} className={`auth-tab${activeTab === 'login' ? ' active' : ''}`} onClick={() => setActiveTab('login')}>登录</button>
                            <button role="tab" aria-selected={activeTab === 'register'} className={`auth-tab${activeTab === 'register' ? ' active' : ''}`} onClick={() => setActiveTab('register')}>注册</button>
                        </div>
                        {activeTab === 'login' ? <LoginForm onLogin={setUser} /> : <RegisterForm onSuccess={() => setActiveTab('login')} />}
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthPage />);
</script>
</body>
